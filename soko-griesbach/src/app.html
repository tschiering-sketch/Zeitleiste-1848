/* ---------- Ansichten ---------- */
const view = document.getElementById("view");
const reg = document.getElementById("register");
const overlay = document.getElementById("overlay");

function isUnlocked(id){ return S.teacher || !!S.unlocked[id]; }
function nextOf(id){ const i = AKTEN.findIndex(a=>a.id===id); return AKTEN[i+1]; }

function renderRegister(){
  const items = [`<button class="tab side" data-go="start" ${S.current==="start"?'aria-current="true"':""}><span class="no">§</span><span class="t">Einweisung</span><span class="st"></span><span class="sub">Rollen, Ablauf, Warnhinweis</span></button>`];
  for (const a of AKTEN){
    const un = isUnlocked(a.id), done = !!S.solved[a.id];
    items.push(`<button class="tab ${un?"":"locked"} ${done?"done":""}" data-go="${a.id}" ${S.current===a.id?'aria-current="true"':""} ${un?"":'aria-disabled="true"'}>
      <span class="no">${a.no}</span><span class="t">${esc(a.title)}</span><span class="st">${done?"erledigt":un?a.min+"′":"gesperrt"}</span><span class="sub">${esc(a.role)}</span></button>`);
  }
  items.push(`<button class="tab side" data-go="bericht" ${S.current==="bericht"?'aria-current="true"':""}><span class="no">✎</span><span class="t">Ermittlungsbericht</span><span class="st"></span><span class="sub">laufend ausfüllen</span></button>`);
  const lageOpen = S.teacher || S.solved.a6;
  items.push(`<button class="tab side ${lageOpen?"":"locked"}" data-go="lage" ${S.current==="lage"?'aria-current="true"':""}><span class="no">⌖</span><span class="t">Lagebesprechung</span><span class="st">${lageOpen?"":"gesperrt"}</span><span class="sub">Plenum · 1921 und heute</span></button>`);
  reg.innerHTML = items.join("");
}

reg.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if(!b) return;
  const id = b.dataset.go;
  if (AKTEN.some(a=>a.id===id) && !isUnlocked(id)) { toast("Diese Akte ist noch gesperrt. Löst die vorige Akte oder gebt den Funkcode ein."); return; }
  if (id==="lage" && !(S.teacher || S.solved.a6)) { toast("Die Lagebesprechung öffnet nach Akte VI oder durch die Lehrkraft."); return; }
  go(id);
});

function go(id){ S.current = id; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  renderRegister();
  if (S.current==="start") return renderStart();
  if (S.current==="bericht") return renderBericht();
  if (S.current==="lage") return renderLage();
  const a = AKTEN.find(x=>x.id===S.current);
  if (!a || !isUnlocked(a.id)) { S.current="start"; return renderStart(); }
  renderAkte(a);
}

/* ---------- Start ---------- */
function renderStart(){
  const started = !!S.start;
  view.innerHTML = `
  <div class="hero">
    <div class="eyebrow">Badische Kriminalpolizei · Sonderkommission · Eingang 26. August 1921</div>
    <h1>Mord auf der<br>Kniebisstraße</h1>
    <div class="telegram">Reichsfinanzminister a.D. Matthias Erzberger bei Bad Griesbach im Schwarzwald erschossen. Begleiter Abg. Diez schwer verletzt. Zwei Täter flüchtig. Soko Griesbach wird gebildet.</div>
    <p class="lead">Ihr seid die Ermittlerinnen und Ermittler der Sonderkommission. In sechs Akten rekonstruiert ihr Tat, Motiv und Täter und folgt einer Spur, die immer wieder nach <b>Bayern</b> führt. Am Ende schreibt ihr einen Bericht an den Staatsanwalt. Die Behörden sind 1921 an diesem Fall gescheitert. Findet heraus, warum.</p>
    <div class="row">
      <label for="team" class="row"><b>Name des Ermittlungsteams:</b> <input class="inp w" id="team" value="${esc(S.team)}" placeholder="z. B. Team Diez"></label>
    </div>
    <div class="row">
      <button class="btn red" id="btnStart" type="button" ${started?"disabled":""}>${started?"Fahndungsuhr läuft":`Fahndungsuhr starten (${DURATION} Minuten)`}</button>
      <button class="btn ghost" type="button" data-open="a1">Zu Akte I: Der Tatort</button>
    </div>
  </div>
  <div style="height:22px"></div>
  <div class="akte">
    <div class="sec"><h3>Eure Rollen im Team</h3>
      <div class="grid2">
        <div class="card"><h4>Spurensicherung</h4><p>wertet Tatort, Befund und Fotos aus. Leitet Akte I.</p></div>
        <div class="card"><h4>Quellenanalyse</h4><p>liest Reden, Zeitungen und Flugschriften und prüft, wer spricht. Leitet Akte II.</p></div>
        <div class="card"><h4>Fahndung</h4><p>arbeitet mit Karte, Fahndungsblättern und Fluchtwegen. Leitet Akte III.</p></div>
        <div class="card"><h4>Aktenführung</h4><p>schreibt den Ermittlungsbericht mit, achtet auf die Zeit und leitet Akte V.</p></div>
      </div>
      <p class="small">Die Akten IV a und IV b (die Spur nach Bayern) bearbeitet ihr gemeinsam. Bei fünf Personen gibt es zwei Personen in der Quellenanalyse.</p>
    </div>
    <div class="sec"><h3>So ermittelt ihr</h3>
      <div class="grid2">
        <div class="card"><h4>Beweismittel</h4><p>Jede Akte enthält Materialien. Die Kennzeichnung zeigt, was ihr vor euch habt:</p><p><span class="kind q">Originalquelle</span> <span class="kind d">Darstellung</span> <span class="kind r">Rekonstruktion · Spielmaterial</span></p></div>
        <div class="card"><h4>Anruf beim Präsidium</h4><p>Kommt ihr nicht weiter, holt euch Hinweise in drei Stufen. Jeder Hinweis kostet Fahndungszeit: 1, 2 bzw. 4 Minuten.</p></div>
        <div class="card"><h4>Funkcode</h4><p>Ist eine Akte gelöst, erscheint ein Funkcode. Damit schalten die anderen Geräte eures Teams die nächste Akte frei (Knopf oben rechts).</p></div>
        <div class="card"><h4>Kriminalrat-Akten</h4><p>Wer schnell ist, löst die Zusatzakte am Ende jeder Akte. Sie ist anspruchsvoller und freiwillig.</p></div>
      </div>
    </div>
    <div class="sec"><div class="warnbox"><b>Hinweis zu den Materialien</b><p>Dieser Fall ist echt. Er handelt von Mord, Hass und Antisemitismus. Einige Quellen sind verletzend, und Polizeifotos zeigen den Toten. Diese Fotos sind unscharf gestellt und gekennzeichnet. Ihr müsst sie nicht aufdecken. Wenn euch etwas belastet, sprecht eure Lehrkraft an.</p></div></div>
  </div>`;
  view.querySelector("#team").addEventListener("input", e => { S.team = e.target.value; save(); });
  const bs = view.querySelector("#btnStart");
  bs.addEventListener("click", () => { if(!S.start){ S.start = Date.now(); save(); tick(); toast("Die Fahndungsuhr läuft. Viel Erfolg, Soko Griesbach!"); renderStart(); } });
  view.querySelector("[data-open]").addEventListener("click", () => go("a1"));
}

/* ---------- Akte ---------- */
function matHTML(m){
  const img = m.img && IMG[m.img] && !IMG[m.img].startsWith("__") ? `<img src="${IMG[m.img]}" alt="Porträtfoto">` : "";
  let body = img ? `<div class="photo">${img}<div>${m.html}</div></div>` : m.html;
  if (m.figs) body += `<div class="figs">${m.figs.map(f => `<figure class="fig ${f.sensitive?"sens":""}"><div class="figimg"><img src="${IMG[f.img]}" alt="${esc(f.alt)}" loading="lazy">${f.sensitive?`<button type="button" class="btn red reveal">Foto aufdecken</button>`:""}</div><figcaption>${esc(f.cap)}</figcaption></figure>`).join("")}</div>`;
  return `<article class="mat ${m.wide?"wide":""}"><header><div><span class="mno">M ${m.no}</span> <h4 style="display:inline">${esc(m.title)}</h4></div><span class="kind ${m.kind}">${kindLabel[m.kind]}</span></header>${body}<div class="src">${esc(m.src)}</div></article>`;
}

function qKey(a,i){ return a.id+"_"+i; }

function qHTML(a, q, i, prefix){
  const key = prefix||qKey(a,i);
  const done = !!S.answers[key];
  let inner = "";
  if (q.type==="choice"){
    inner = `<div class="opts">${q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="${key}" value="${j}" ${done&&j===q.a?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div>`;
  } else if (q.type==="multi"){
    inner = `<div class="opts">${q.opts.map((o,j)=>`<label class="opt"><input type="checkbox" name="${key}" value="${j}" ${done&&o.c?"checked":""}><span>${esc(o.t)}</span></label>`).join("")}</div>`;
  } else if (q.type==="numbers"){
    inner = `<div class="row">${q.fields.map((f,j)=>`<label class="row" for="${key}_${j}">${esc(f.l)}: <input class="inp n" id="${key}_${j}" inputmode="numeric" value="${done?f.a:""}"></label>`).join("")}</div>`;
  } else if (q.type==="text" || q.type==="cipher"){
    inner = `<input class="inp w" id="${key}_t" autocomplete="off" placeholder="${esc(q.hintAccept||"Antwort eingeben")}">`;
  } else if (q.type==="order"){
    const st = S.answers[key+"_ord"] || shuffleIdx(q.items.length, key);
    if (!S.answers[key+"_ord"]) { S.answers[key+"_ord"] = st; save(); }
    inner = `<ol class="order" id="${key}_ol">${st.map((ix,p)=>`<li data-ix="${ix}"><span class="pos">${p+1}.</span><span>${esc(q.items[ix])}</span><span class="mv"><button type="button" aria-label="nach oben" data-mv="-1">▲</button><button type="button" aria-label="nach unten" data-mv="1">▼</button></span></li>`).join("")}</ol>`;
  } else if (q.type==="match"){
    inner = `<div class="match">${q.rows.map((r,j)=>`<div class="mrow"><span>${esc(r.t)}</span><select class="inp" id="${key}_${j}" aria-label="Zuordnung"><option value="">– wählen –</option>${q.cats.map((c,k)=>`<option value="${k}" ${done&&k===r.a?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`).join("")}</div>`;
  } else if (q.type==="route"){
    inner = mapSVG(key) + `<div class="row"><span class="small" id="${key}_seq">Gewählt: –</span><button class="btn ghost" type="button" data-reset="${key}">Auswahl zurücksetzen</button></div>`;
  } else if (q.type==="check"){
    inner = `<label class="opt"><input type="checkbox" id="${key}_c" ${done?"checked":""}><span>${esc(q.label)}</span></label>`;
  }
  return `<div class="q ${done?"ok":""}" data-key="${key}">
    <div class="qn">Ermittlungsfrage ${prefix?"K":i+1}</div><div class="qt">${esc(q.q)}</div>${inner}
    <div class="row"><button class="btn" type="button" data-check="${key}" ${done?"disabled":""}>${done?"Gelöst":"Prüfen"}</button></div>
    <div class="fbslot">${done?`<div class="fb ok">${esc(q.ok)}</div>`:""}</div></div>`;
}

function shuffleIdx(n, seedStr){
  let s = 0; for (const ch of seedStr) s = (s*31 + ch.charCodeAt(0)) >>> 0;
  const arr = [...Array(n).keys()];
  for (let k=0;k<6;k++){
    for (let i=n-1;i>0;i--){ s = (s*1103515245+12345) >>> 0; const j = s % (i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    if (arr.some((v,i)=>v!==i)) break;
  }
  return arr;
}

function renderAkte(a){
  const done = !!S.solved[a.id];
  const used = S.hints[a.id]||0;
  const allQ = a.qs.every((q,i)=>S.answers[qKey(a,i)]);
  const revealShown = a.reveal && S.answers[qKey(a,a.reveal.after)];
  const nx = nextOf(a.id);
  view.innerHTML = `<article class="akte">
    <div class="akte-head">
      <div class="aktenz"><span>${esc(a.az)}</span><span>Akte ${a.no}</span><span>Richtzeit ${a.min} Min.</span></div>
      <h2>${esc(a.title)}</h2>
      <div class="rolle"><span class="chip">Leitung: ${esc(a.role)}</span><span class="chip red">${esc(a.sub)}</span></div>
      ${done?`<div class="stamp stamp-in">Erledigt</div>`:""}
    </div>
    <div class="sec"><h3>Auftrag</h3><p class="auftrag">${a.auftrag}</p></div>
    <div class="sec"><h3>Beweismittel</h3><div class="mats">${a.mats.map(matHTML).join("")}</div></div>

function wireAkte(a){
  view.querySelectorAll(".reveal").forEach(b => b.addEventListener("click", () => b.closest(".fig").classList.add("open")));
  view.querySelectorAll("[data-check]").forEach(b => b.addEventListener("click", () => check(a, b.dataset.check)));
  view.querySelectorAll(".order").forEach(ol => ol.addEventListener("click", e => {
    const b = e.target.closest("[data-mv]"); if(!b) return;
    const key = ol.id.replace(/_ol$/,""); if (S.answers[key]) return;
    const arr = S.answers[key+"_ord"]; const li = b.closest("li");
    const pos = [...ol.children].indexOf(li), np = pos + Number(b.dataset.mv);
    if (np<0 || np>=arr.length) return;
    [arr[pos],arr[np]] = [arr[np],arr[pos]]; save(); render();
    const again = document.getElementById(key+"_ol"); if (again) again.children[np].querySelector(`[data-mv="${b.dataset.mv}"]`)?.focus();
  }));
  const hb = view.querySelector("#btnHint");
  if (hb) hb.addEventListener("click", () => askHint(a));
  const nb = view.querySelector("#btnNext"); if (nb) nb.addEventListener("click", () => go(nextOf(a.id).id));
  const lb = view.querySelector("#btnLage"); if (lb) lb.addEventListener("click", () => go("lage"));
  // Karte
  view.querySelectorAll("svg[data-route]").forEach(svg => {
    const key = svg.dataset.route;
    const sel = () => S.answers[key+"_route"] || [];
    const paint = () => {
      const seq = sel();
      svg.querySelectorAll(".city").forEach(g => g.classList.toggle("sel", seq.includes(g.dataset.c)));
      const pts = seq.map(c => CITIES.find(x=>x.id===c)).map(c => `${c.x},${c.y}`).join(" ");
      svg.querySelector(".route").setAttribute("points", pts);
      const lab = document.getElementById(key+"_seq");
      if (lab) lab.textContent = "Gewählt: " + (seq.length ? seq.map(c=>CITIES.find(x=>x.id===c).n).join(" → ") : "–");
    };
    svg.addEventListener("click", e => {
      const g = e.target.closest(".city"); if (!g || S.answers[key]) return;
      const seq = sel(); if (seq[seq.length-1]===g.dataset.c) return;
      seq.push(g.dataset.c); S.answers[key+"_route"] = seq; save(); paint();
    });
    svg.addEventListener("keydown", e => { if ((e.key==="Enter"||e.key===" ") && e.target.closest(".city")) { e.preventDefault(); e.target.closest(".city").dispatchEvent(new MouseEvent("click",{bubbles:true})); } });
    paint();
  });
  view.querySelectorAll("[data-reset]").forEach(b => b.addEventListener("click", () => { const k=b.dataset.reset; if (S.answers[k]) return; S.answers[k+"_route"]=[]; save(); render(); }));
  // Chiffre
  const cr = view.querySelector("#cryp");
  if (cr){
    const enc = caesar(CIPHER_PLAIN, CIPHER_KEY);
    cr.textContent = enc;
    const sh = view.querySelector("#shift"), sv = view.querySelector("#shiftv"), al = view.querySelector("#alpha");
    const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const draw = () => { const k = Number(sh.value); sv.textContent = k;
      al.innerHTML = `<div>${A.split("").join(" ")}</div><div class="dim">${A.split("").map(ch=>String.fromCharCode((ch.charCodeAt(0)-65-k+26)%26+65)).join(" ")}</div>`; };
    sh.addEventListener("input", draw); draw();
  }
}

function check(a, key){
  const isBonus = key.endsWith("_bonus");
  const q = isBonus ? a.bonus.q : a.qs[Number(key.split("_").pop())];
  const box = view.querySelector(`.q[data-key="${key}"]`);
  let ok = false;
  if (q.type==="choice"){ const r = box.querySelector("input:checked"); ok = r && Number(r.value)===q.a; }
  else if (q.type==="multi"){ const vals = [...box.querySelectorAll("input")].map(x=>x.checked); ok = vals.every((v,j)=>v===q.opts[j].c); }
  else if (q.type==="numbers"){ ok = q.fields.every((f,j)=>Number(box.querySelector(`#${key}_${j}`).value.trim())===f.a); }
  else if (q.type==="text"||q.type==="cipher"){ const v = norm(box.querySelector(`#${key}_t`).value); ok = q.accept.some(x=>v.includes(x)); }
  else if (q.type==="order"){ ok = S.answers[key+"_ord"].every((v,j)=>v===j); }
  else if (q.type==="match"){ ok = q.rows.every((r,j)=>box.querySelector(`#${key}_${j}`).value===String(r.a)); }
  else if (q.type==="route"){ const s = S.answers[key+"_route"]||[]; ok = s.length===q.a.length && s.every((v,j)=>v===q.a[j]); }
  else if (q.type==="check"){ ok = box.querySelector(`#${key}_c`).checked; }
  const slot = box.querySelector(".fbslot");
  if (ok){
    S.answers[key] = true; if (isBonus) S.bonus[a.id] = true; save();
    render();
    const nb = view.querySelector(`.q[data-key="${key}"]`); if (nb) nb.scrollIntoView({block:"nearest"});
  } else {
    slot.innerHTML = `<div class="fb no">${wrongMsg(q)}</div>`;
  }
}
function wrongMsg(q){
  if (q.type==="multi") return "Noch nicht ganz. Prüft jede Aussage einzeln an den Beweismitteln. Es kann mehrere richtige geben.";
  if (q.type==="order") return "Die Reihenfolge stimmt noch nicht. Sucht in den Materialien nach Daten und Jahreszahlen.";
  if (q.type==="match") return "Mindestens eine Zuordnung stimmt noch nicht.";
  if (q.type==="route") return "Der Fluchtweg stimmt noch nicht. Setzt die Auswahl zurück und beginnt am Tatort.";
  if (q.type==="numbers") return "Mindestens eine Zahl stimmt nicht. Schaut in den Befund und in die Zeugenaussage.";
  if (q.type==="check") return "Setzt den Haken erst, wenn der Bericht wirklich fertig ist.";
  return "Das trifft es noch nicht. Lest die Beweismittel noch einmal genau.";
}

function solve(a){
  S.solved[a.id] = true;
  const nx = nextOf(a.id); if (nx) S.unlocked[nx.id] = true;

  toast(`Akte ${a.no} gelöst! Funkcode: ${a.code}`);
}

function askHint(a){

           m.querySelector("#mNo").onclick = close; });
}

function solText(q){
  if (q.type==="choice") return q.opts[q.a];
  if (q.type==="multi") return q.opts.filter(o=>o.c).map(o=>o.t).join(" | ");
  if (q.type==="numbers") return q.fields.map(f=>`${f.l}: ${f.a}`).join(", ");
  if (q.type==="text"||q.type==="cipher") return q.accept.join(" / ") + (q.type==="cipher" ? ` (Schlüssel ${CIPHER_KEY}: ${CIPHER_PLAIN})` : "");
  if (q.type==="order") return q.items.join(" → ");
  if (q.type==="match") return q.rows.map(r=>`${r.t} = ${q.cats[r.a]}`).join(" | ");
  if (q.type==="route") return q.a.map(id=>CITIES.find(c=>c.id===id).n).join(" → ");
  if (q.type==="check") return "Haken setzen, wenn der Bericht vorliegt";
  return "";
}
function teacherPanel(){
  const rows = AKTEN.map(a => `<details><summary><b>Akte ${a.no}: ${esc(a.title)}</b>, Funkcode <code>${a.code}</code></summary><ol class="small">${a.qs.map(q=>`<li>${esc(solText(q))}</li>`).join("")}<li>Bonus: ${esc(solText(a.bonus.q))}</li></ol></details>`).join("");
  modal(`<h3>Lehrkraft-Modus</h3><p class="small">Auf diesem Gerät sind jetzt alle Akten offen. Strafzeit bisher: ${S.penalty} Min. Gelöst: ${Object.keys(S.solved).length} von ${AKTEN.length}.</p>${rows}
   <div class="row"><button class="btn" id="tLage" type="button">Lagebesprechung öffnen</button><button class="btn ghost" id="tOff" type="button">Lehrkraft-Modus beenden</button><button class="btn red" id="tReset" type="button">Gerät zurücksetzen</button></div><div id="tMsg"></div>`, m => {
    m.querySelector("#tLage").onclick = () => { close(); go("lage"); };
    m.querySelector("#tOff").onclick = () => { S.teacher = false; save(); close(); render(); };
    m.querySelector("#tReset").onclick = () => {
      m.querySelector("#tMsg").innerHTML = `<div class="fb no">Wirklich alle Antworten, Bericht und Uhr auf diesem Gerät löschen? <button class="btn red" id="tReset2" type="button">Ja, zurücksetzen</button></div>`;
      m.querySelector("#tReset2").onclick = () => { S = fresh(); save(); close(); render(); tick(); toast("Gerät zurückgesetzt."); };
    };
  });
}

let toastT;
function toast(msg){
  let t = document.querySelector(".toast"); if (!t){ t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 3800);
}

/* ---------- Fahndungsuhr ---------- */
const tEl = document.getElementById("timer"), pEl = document.getElementById("pen");
function tick(){
  if (!S.start){ tEl.textContent = DURATION + ":00"; tEl.classList.remove("low"); pEl.textContent = "Fahndungsuhr noch nicht gestartet"; return; }
  const left = DURATION*60 - Math.floor((Date.now()-S.start)/1000) - S.penalty*60;
  const a = Math.abs(left), mm = Math.floor(a/60), ss = String(a%60).padStart(2,"0");
  tEl.textContent = (left<0?"+":"") + mm + ":" + ss;
  tEl.classList.toggle("low", left < 10*60);
  pEl.textContent = left<0 ? "Die Täter sind über die Grenze! Ermittelt trotzdem weiter." : (S.penalty ? `davon ${S.penalty} Min. Abzug für Hinweise` : "Fahndungszeit");
}
setInterval(tick, 1000); tick();

render();
