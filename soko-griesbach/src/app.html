<title>Soko Griesbach 1921</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap">
<style>
/* Layout: Schreibtisch der Kriminalpolizei – Aktenregister links (Reiter), aufgeschlagene Akte rechts, Kopfleiste mit Fahndungsuhr */
:root{
  --desk:#e3e5dd; --paper:#fbf8ef; --paper-2:#f0e9d6; --ink:#1c2531; --ink-soft:#505a63;
  --rule:#cbc4b0; --stamp:#ac2a20; --folder:#c4943f; --folder-ink:#2a1f0c; --ok:#2e6a39; --warn:#8a5d00;
  --focus:#1f4fd1; --shade:rgba(28,37,49,.08); --veil:rgba(20,24,28,.82);
  --font-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-doc:"Courier Prime","Courier New",Courier,monospace;
  --font-frak:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#121517; --paper:#1d2124; --paper-2:#262b2f; --ink:#ebe5d5; --ink-soft:#aaa597;
  --rule:#3b4145; --stamp:#e5594d; --folder:#d2a650; --folder-ink:#1a1306; --ok:#72c180; --warn:#e1b44b;
  --focus:#8fb0ff; --shade:rgba(0,0,0,.35); --veil:rgba(0,0,0,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#121517; --paper:#1d2124; --paper-2:#262b2f; --ink:#ebe5d5; --ink-soft:#aaa597;
  --rule:#3b4145; --stamp:#e5594d; --folder:#d2a650; --folder-ink:#1a1306; --ok:#72c180; --warn:#e1b44b;
  --focus:#8fb0ff; --shade:rgba(0,0,0,.35); --veil:rgba(0,0,0,.85); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}

/* Kopfleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--paper);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-stretch:75%;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:1.05rem}
.brand span{font-size:.78rem;opacity:.75;letter-spacing:.04em}
.clock{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.timer{font-family:var(--font-doc);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.timer.low{color:#ffb4a8}
.pen{font-size:.78rem;opacity:.8}
.barbtn{background:transparent;border:1px solid currentColor;color:inherit;border-radius:3px;padding:6px 10px;font-size:.85rem;cursor:pointer;font-stretch:85%;font-weight:600;letter-spacing:.03em}
.barbtn:hover{background:rgba(255,255,255,.1)}
@media (max-width:600px){.brand span,.pen{display:none}.bar{padding-block:6px}.timer{font-size:1.25rem}}

/* Grundraster */
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;max-width:1280px;margin:0 auto}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}

/* Aktenregister */
.register{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:860px){.register{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.tab{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%;
  background:var(--folder);color:var(--folder-ink);border:0;border-radius:4px 14px 14px 4px;padding:9px 12px;cursor:pointer;
  box-shadow:0 1px 0 var(--shade);min-width:190px}
.tab .no{font-family:var(--font-doc);font-weight:700;font-size:.85rem}
.tab .t{font-stretch:85%;font-weight:700;line-height:1.2}
.tab .st{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tab .sub{grid-column:2/4;font-size:.75rem;opacity:.8}
.tab[aria-current="true"]{outline:3px solid var(--ink);outline-offset:-3px}
.tab.locked{background:var(--paper-2);color:var(--ink-soft);cursor:not-allowed}
.tab.done .st{color:var(--ok)}
.tab.side{background:var(--paper);color:var(--ink);border:1px solid var(--rule)}

/* Akte */
.akte{background:var(--paper);border:1px solid var(--rule);border-radius:3px;box-shadow:0 2px 0 var(--shade),0 12px 30px var(--shade);min-width:0}
.akte-head{border-bottom:2px solid var(--ink);padding:20px 24px 16px;display:grid;gap:8px;position:relative}
.aktenz{font-family:var(--font-doc);font-size:.85rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 16px}
.akte-head h2{font-stretch:78%;font-weight:800;font-size:clamp(1.6rem,3.6vw,2.4rem);letter-spacing:.01em;text-transform:uppercase}
.rolle{display:inline-flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1.5px solid var(--ink);padding:2px 8px;border-radius:2px}
.chip.red{border-color:var(--stamp);color:var(--stamp)}
.stamp{position:absolute;right:22px;top:18px;transform:rotate(-8deg);border:3px double var(--stamp);color:var(--stamp);
  font-family:var(--font-doc);font-weight:700;font-size:1.1rem;padding:4px 12px;letter-spacing:.12em;opacity:.85;text-transform:uppercase}
.sec{padding:20px 24px;border-bottom:1px dashed var(--rule);display:grid;gap:14px}
.sec:last-child{border-bottom:0}
.sec h3{font-stretch:85%;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase}
.auftrag{font-size:1.05rem;max-width:68ch}
.auftrag strong{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--folder) 45%,transparent) 60%)}

/* Beweismittel */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.mat{background:var(--paper-2);border:1px solid var(--rule);padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.mat.wide{grid-column:1/-1}
.mat header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.mat .mno{font-family:var(--font-doc);font-weight:700}
.mat h4{margin:0;font-stretch:88%;font-size:1rem;line-height:1.25}
.kind{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:2px;white-space:nowrap}
.kind.q{background:var(--ink);color:var(--paper)}
.kind.d{border:1px solid var(--ink-soft);color:var(--ink-soft)}
.kind.r{border:1px dashed var(--stamp);color:var(--stamp)}
.doc{font-family:var(--font-doc);font-size:.95rem;line-height:1.55;white-space:normal}
.doc p+p{margin-top:.6em}
.doc .fr{font-family:var(--font-frak);font-size:1.35rem;line-height:1.1}
.src{font-size:.75rem;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:6px}
.figs{display:flex;flex-wrap:wrap;gap:12px}
.fig{margin:0;display:grid;gap:6px;flex:1 1 220px;min-width:0}
.fig{max-width:400px}
.mat.wide .fig:only-child{max-width:760px}
.figimg{position:relative;background:#111;border:4px solid var(--paper);box-shadow:0 1px 4px var(--shade);overflow:hidden}
.figimg img{display:block;width:100%;height:auto;filter:sepia(.2) contrast(1.05)}
.fig figcaption{font-size:.82rem;color:var(--ink-soft);font-family:var(--font-doc)}
.fig.sens img{filter:blur(22px) grayscale(1);transform:scale(1.1)}
.fig.sens.open img{filter:sepia(.2);transform:none}
.fig.sens .reveal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.fig.sens.open .reveal{display:none}
.photo{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.photo img{width:110px;height:auto;border:4px solid var(--paper);box-shadow:0 1px 3px var(--shade);filter:sepia(.25) contrast(1.05)}
@media (max-width:420px){.photo{grid-template-columns:1fr}.photo img{width:140px}}
.ext{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:.9rem;border:1.5px solid var(--ink);padding:6px 10px;border-radius:3px;text-decoration:none;width:fit-content}
.ext:hover{background:var(--ink);color:var(--paper)}
.warnbox{border:2px solid var(--stamp);padding:10px 12px;font-size:.9rem;display:grid;gap:8px}
.warnbox b{color:var(--stamp);letter-spacing:.05em;text-transform:uppercase;font-size:.8rem}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:0;font-size:.92rem}
dl.kv dt{font-weight:700;font-stretch:88%}
dl.kv dd{margin:0}
@media (max-width:420px){dl.kv{grid-template-columns:1fr}dl.kv dd{margin-bottom:4px}}
.quote{font-family:var(--font-doc);border-left:3px solid var(--ink);padding-left:12px}

/* Fragen */
.qs{display:grid;gap:16px}
.q{border:1.5px solid var(--ink);background:var(--paper);padding:14px 16px;display:grid;gap:10px}
.q.ok{border-color:var(--ok)}
.q .qt{font-weight:700;max-width:70ch}
.q .qn{font-family:var(--font-doc);color:var(--ink-soft);font-size:.85rem}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border:1px solid var(--rule);border-radius:3px;cursor:pointer;background:var(--paper-2)}
.opt input{margin-top:4px;accent-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{border:1.5px solid var(--ink);background:var(--paper);padding:7px 9px;border-radius:2px;min-width:0}
.inp.n{width:5.5em;font-family:var(--font-doc);font-weight:700}
.inp.w{width:min(100%,420px)}
select.inp{max-width:100%}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:3px;padding:8px 14px;font-weight:700;cursor:pointer;font-stretch:88%;letter-spacing:.03em}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.red{background:var(--stamp);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fb{font-size:.92rem;padding:8px 10px;border-radius:3px}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);border-left:4px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--stamp) 12%,transparent);border-left:4px solid var(--stamp)}
.order{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.order li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--paper-2);border:1px solid var(--rule);padding:6px 8px}
.order .pos{font-family:var(--font-doc);font-weight:700}
.order .mv{display:flex;gap:4px}
.order .mv button{border:1px solid var(--ink);background:var(--paper);border-radius:2px;width:30px;height:30px;cursor:pointer}
.match{display:grid;gap:8px}
.match .mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px);gap:10px;align-items:center;background:var(--paper-2);border:1px solid var(--rule);padding:8px}
@media (max-width:560px){.match .mrow{grid-template-columns:1fr}}

/* Hinweise */
.hints{display:grid;gap:10px}
.hintrow{display:flex;flex-wrap:wrap;gap:8px}
.hint{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);padding:8px 12px;font-size:.95rem}
.hint b{font-stretch:85%;letter-spacing:.04em}

/* Bonus */
.bonus{border:2px dashed var(--folder);padding:14px 16px;display:grid;gap:10px}
.bonus h4{margin:0;font-stretch:85%;letter-spacing:.06em;text-transform:uppercase}

/* Abschluss einer Akte */
.solved{background:var(--ink);color:var(--paper);padding:16px 20px;display:grid;gap:8px}
.solved .code{font-family:var(--font-doc);font-size:1.6rem;font-weight:700;letter-spacing:.2em}

/* Karte */
.mapbox{overflow-x:auto;border:1px solid var(--rule);background:var(--paper)}
.mapbox svg{display:block;min-width:620px;width:100%;height:auto}
.city circle{fill:var(--paper);stroke:var(--ink);stroke-width:2;cursor:pointer}
.city text{fill:var(--ink);font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer}
.city .hit{fill:transparent;cursor:pointer}
.city.sel circle{fill:var(--stamp);stroke:var(--stamp)}
.city:focus-visible circle{stroke:var(--focus);stroke-width:4}
.region{fill:var(--ink-soft);font-family:var(--font-ui);font-size:15px;font-weight:800;letter-spacing:.3em;opacity:.35}
.route{stroke:var(--stamp);stroke-width:3;fill:none;stroke-dasharray:7 5}
.map-bg{fill:var(--paper-2)}
.map-grid{stroke:var(--rule);stroke-width:1}

/* Chiffrierscheibe */
.cipher{display:grid;gap:8px}
.alpha{font-family:var(--font-doc);font-weight:700;overflow-x:auto;white-space:nowrap;background:var(--paper);border:1px solid var(--rule);padding:6px 8px;letter-spacing:.25em}
.alpha .dim{color:var(--ink-soft)}
.cryp{font-family:var(--font-doc);font-weight:700;font-size:1.1rem;letter-spacing:.18em;word-break:break-all;background:var(--paper);border:1px dashed var(--ink);padding:10px}

/* Startseite */
.hero{background:var(--paper);border:1px solid var(--rule);padding:28px 28px 24px;display:grid;gap:16px;box-shadow:0 12px 30px var(--shade);position:relative;overflow:hidden}
.hero .eyebrow{font-family:var(--font-doc);color:var(--ink-soft);font-size:.9rem}
.hero h1{font-stretch:72%;font-weight:800;font-size:clamp(2.2rem,6vw,4rem);text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.hero .lead{font-size:1.1rem;max-width:62ch}
.telegram{font-family:var(--font-doc);background:var(--paper-2);border:1px solid var(--rule);padding:14px 16px;max-width:640px;text-transform:uppercase;letter-spacing:.04em;line-height:1.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.card{border:1.5px solid var(--ink);padding:12px 14px;display:grid;gap:6px;background:var(--paper)}
.card h4{margin:0;font-stretch:85%;letter-spacing:.05em;text-transform:uppercase}
.small{font-size:.85rem;color:var(--ink-soft)}

/* Lagebesprechung */
.lage{display:grid;gap:22px}
.tl{display:grid;gap:0;border-left:3px solid var(--ink);margin-left:8px}
.tl .ev{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:8px 0 8px 16px;position:relative}
.tl .ev::before{content:"";position:absolute;left:-8px;top:15px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.tl .ev.now::before{background:var(--stamp);border-color:var(--stamp)}
.tl .d{font-family:var(--font-doc);font-weight:700}
@media (max-width:520px){.tl .ev{grid-template-columns:1fr;gap:2px}}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.vs .card.now{border-color:var(--stamp)}
.tablewrap{overflow-x:auto}
table.cmp{border-collapse:collapse;width:100%;min-width:560px;font-size:.93rem}
table.cmp th,table.cmp td{border:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
table.cmp th{background:var(--paper-2);font-stretch:88%}

/* Overlays */
.veil{position:fixed;inset:0;background:var(--veil);display:grid;place-items:center;z-index:20;padding:16px}
.dialog{background:var(--paper);color:var(--ink);max-width:560px;width:100%;border:2px solid var(--ink);padding:20px;display:grid;gap:12px;max-height:90vh;overflow:auto}
.dialog h3{font-stretch:85%;text-transform:uppercase;letter-spacing:.05em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:3px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
textarea.inp{width:100%;min-height:96px;resize:vertical;font-family:var(--font-doc)}
.berichtf{display:grid;gap:14px}
.berichtf label{font-weight:700;display:grid;gap:6px}
.berichtf label span{font-weight:400;font-size:.88rem;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){
  .stamp-in{animation:stampin .35s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes stampin{from{transform:rotate(-8deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.85}}
}
</style>

<header class="bar">
  <div class="brand"><b>Soko Griesbach</b><span>Badische Kriminalpolizei · Staatsanwaltschaft Offenburg · 1921</span></div>
  <div class="clock">
    <div><div class="timer" id="timer">72:00</div><div class="pen" id="pen">Fahndungsuhr noch nicht gestartet</div></div>
    <button class="barbtn" id="btnFunk" type="button">Funkcode eingeben</button>

<main class="wrap"><div class="layout">

</div></main>

<div id="overlay"></div>

<script>
(() => {
"use strict";
const IMG = {erzberger:"__IMG_erzberger__",helfferich:"__IMG_helfferich__",rathenau:"__IMG_rathenau__",kahr:"__IMG_kahr__",tatortskizze:"__IMG_tatortskizze__",boeschung:"__IMG_boeschung__",leichenschau:"__IMG_leichenschau__",fahndungsfoto:"__IMG_fahndungsfoto__",killinger:"__IMG_killinger__",hoffmann:"__IMG_hoffmann__",telegramm:"__IMG_telegramm__",urteil:"__IMG_urteil__",aufruf:"__IMG_aufruf__",volk:"__IMG_volk__",trauerplakat:"__IMG_trauerplakat__"};
const DURATION = 72; // Minuten Fahndungszeit (Akten I–VI); Einstieg 5' + Lagebesprechung 13' kommen hinzu
const PENALTY = [1,2,4];
const PIN = "1921";
const LS = "sokoGriesbach_v1";

/* ---------- Hilfsfunktionen ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,"");
const commons = f => "https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(f.replace(/ /g,"_"));
const kindLabel = {q:"Originalquelle", d:"Darstellung", r:"Rekonstruktion · Spielmaterial"};

function caesar(txt, k){
  return txt.replace(/[A-Z]/g, ch => String.fromCharCode((ch.charCodeAt(0)-65+k)%26+65));
}
const CIPHER_PLAIN = "ZENTRALE MUENCHEN TRAUTENWOLFSTRASSE ACHT TARNUNG BAYERISCHE HOLZVERWERTUNGSGESELLSCHAFT";
const CIPHER_KEY = 8;

/* ---------- Zustand ---------- */
let S = load();
function fresh(){ return {start:null, penalty:0, solved:{}, unlocked:{a1:true}, answers:{}, hints:{}, bonus:{}, bericht:{}, current:"start", team:"", teacher:false, revealed:{}}; }
function load(){ try{ const x = JSON.parse(localStorage.getItem(LS)); return x ? Object.assign(fresh(), x) : fresh(); }catch(e){ return fresh(); } }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

/* ---------- Akten-Daten ---------- */
const AKTEN = [
{
 id:"a1", no:"I", title:"Der Tatort", sub:"Kniebisstraße, 26. August 1921", role:"Spurensicherung", min:12, code:"KNIEBIS",
 az:"Az. St. 1921/26-08 · Bad Griesbach (Renchtal)",
 auftrag:`Matthias Erzberger, früherer Reichsfinanzminister, ist tot. Rekonstruiert den <strong>Tathergang</strong>: Wo geschah die Tat, wie viele Täter waren beteiligt, und war es eine spontane Tat oder ein <strong>geplanter Anschlag</strong>?`,
 mats:[
  {no:"1.1", kind:"r", title:"Fernspruch an die Staatsanwaltschaft", html:`<div class="doc"><p>FERNSPRUCH · 26. AUGUST 1921</p><p>GENDARMERIE GRIESBACH AN STAATSANWALTSCHAFT OFFENBURG. HEUTE AM SPAETEN VORMITTAG AUF DER KNIEBISSTRASSE OBERHALB GRIESBACH REICHSFINANZMINISTER A.D. ERZBERGER ERSCHOSSEN. REICHSTAGSABGEORDNETER DIEZ SCHWER VERLETZT. ZWEI JUNGE MAENNER ZU FUSS FLUECHTIG. SOFORTIGE FAHNDUNG ERBETEN.</p></div>`,
   src:"Für das Spiel formuliert. Die Fakten (Ort, Opfer, Flucht zu Fuß) folgen Gebhardt 1995, S. 42–48."},
  {no:"1.2", kind:"r", title:"Aussage des Zeugen Carl Diez (Zentrum, MdR)", html:`<div class="doc"><p>„Wir sind gegen zehn Uhr vom Kurhaus in Griesbach aufgebrochen und auf der Kniebisstraße in Richtung Alexanderschanze spaziert. Zwei junge Männer gingen hinter uns her. Wir haben uns nichts dabei gedacht.</p><p>Auf dem Rückweg sprang einer von ihnen auf Erzberger zu und schoss aus kurzer Entfernung. Ich habe mit meinem Regenschirm nach ihm geschlagen. Da schoss der zweite auf mich. Erzberger rutschte eine Böschung hinunter. Der zweite Mann stieg ihm nach. Danach liefen beide davon. Ich habe mich verletzt nach Griesbach zurückgeschleppt und die Polizei verständigt.“</p></div>`,
   src:"Nachgestellte Aussage. Der Inhalt folgt der Rekonstruktion des Tathergangs bei Cord Gebhardt: Der Fall des Erzberger-Mörders Heinrich Tillessen, Tübingen 1995, S. 42–48."},
  {no:"1.3", kind:"d", title:"Befund am Leichnam", html:`<dl class="kv"><dt>Opfer</dt><dd>Matthias Erzberger, geb. 20.9.1875, Zentrumsabgeordneter</dd><dt>Treffer</dt><dd><b>acht</b> Schusstreffer</dd><dt>Todesursache</dt><dd>zwei Kopfschüsse aus nächster Nähe, beide für sich allein tödlich</dd><dt>Fundort</dt><dd>unterhalb der Straße; das Opfer war nach den ersten Schüssen eine Böschung hinabgerutscht</dd><dt>Zweites Opfer</dt><dd>Carl Diez, mehrere Schussverletzungen, überlebt</dd></dl>`,
   src:"Zusammenfassung nach Gebhardt 1995, S. 42–48, und dem Artikel „Matthias Erzberger“ der deutschsprachigen Wikipedia, Abschnitt Ermordung."},
  {no:"1.4", kind:"q", title:"Tatortfoto der Polizei: die Böschung", figs:[{img:"boeschung", alt:"Waldhang mit Fichten, Schwarzweißfoto", cap:"Beschriftung im Lichtbildalbum: „Böschung“. ⊗ = Landstraße, ⊕ = Fundort der Leiche"}],
   html:`<p>Die Kriminalpolizei klebte ihre Tatortaufnahmen in ein Album. Dieses Foto zeigt den Hang unterhalb der Straße, den Erzberger nach den ersten Schüssen hinabrutschte.</p>`,
   src:"Landesarchiv Baden-Württemberg, Abt. Staatsarchiv Freiburg, F 179/4 (Staatsanwaltschaft Offenburg), Lichtbildmappe aus dem Ermittlungsverfahren 1921/22, Permalink 5-68430. Lizenz CC BY 3.0. Ausschnitt."},
  {no:"1.5", kind:"q", title:"Tatortskizze der Kriminalpolizei Offenburg", wide:true, figs:[{img:"tatortskizze", alt:"Handgezeichnete Karte von Bad Griesbach mit Straße, Kehren und nummerierten Punkten", cap:"Zeichenerklärung (auf der Skizze): 1 Umkehrpunkt Erzbergers · 2 Umkehrpunkt der Täter · 3 Tatort · 4 Vermutlicher Abkürzungsweg der Täter"}],
   html:`<p>Aufschrift: „Staatl. Kriminalpolizeistelle Offenburg, Erkennungsdienst. Skizze Mordprozess Erzberger“. Sucht auf der Skizze den Ort Griesbach, die Straße nach Osten und die Punkte 1 bis 4.</p>`,
   src:"Landesarchiv Baden-Württemberg, Abt. Staatsarchiv Freiburg, F 179/4 (Staatsanwaltschaft Offenburg), Fünf Pläne des Tatorts und der Umgebung, Permalink 5-68524. Die Skizze liegt in den Akten zum zweiten Verfahren (1946–1952) und entstand vermutlich für den Prozess gegen Tillessen. Lizenz CC BY 3.0."},
  {no:"1.6", kind:"r", title:"Meldezettel, Gasthaus „Zum Goldenen Engel“, Ulm", html:`<div class="doc"><p>Wengengasse 21 · Zimmer Nr. 11<br>Aufenthalt: 19. bis 21. August 1921</p><p>1. <b>Ernst Berkner</b>, Kaufmann, aus Jena<br>2. <b>Rudolf Briese</b>, stud. jur., aus Würzburg</p></div>`,
   src:"Nach den erhaltenen Meldezetteln wiedergegeben, zitiert bei Günter Randecker: Erzberger-Attentäter schmiedeten die Mordpläne auch von Ulm aus, Schwäbische Zeitung, 24.8.2021. Die Gestaltung ist nachgestellt."},
  {no:"1.7", kind:"d", title:"Ermittlungsnotiz: Anfragen in Beuron", html:`<dl class="kv"><dt>8.–19. Aug.</dt><dd>Familie Erzberger macht Urlaub im Hotel „Waldeck“ in Beuron (Donautal).</dd><dt>19. Aug., 6.23 Uhr</dt><dd>Die Familie reist aus Beuron ab.</dd><dt>19. Aug., 16 Uhr</dt><dd>Zwei Männer fragen auf dem Postamt Beuron nach Erzbergers neuer Adresse. Ohne Erfolg. Das Postamt meldet den Vorgang nach Berlin, aber Erzberger wird nicht gewarnt.</dd><dt>20. Aug.</dt><dd>Telefongespräch aus Ulm mit einem Klosterbruder der Erzabtei Beuron: Erzberger sei „ins Renchtal“ gefahren.</dd></dl>`,
   src:"Nach Randecker, Schwäbische Zeitung, 24.8.2021, der sich auf Meldezettel und Akten stützt."},
  {no:"1.8", kind:"q", title:"Lichtbilder der Leichenschau, 1921", figs:[{img:"leichenschau", sensitive:true, alt:"Fotos des Leichnams mit Schussverletzungen", cap:"Albumseite mit Aufnahmen der Leichenschau. Markiert sind die Einschüsse."}],
   html:`<div class="warnbox"><b>Achtung: Diese Fotos zeigen den Toten</b><p>Die Aufnahmen sind unscharf gestellt. Ihr braucht sie für die Lösung nicht. Deckt sie nur auf, wenn ihr euch das zutraut.</p><a class="ext" href="${commons("Matthias Erzberger Tatortfoto 1921.webp")}" target="_blank" rel="noopener">Weiteres Polizeifoto: Erzberger am Fundort ↗</a></div>`,
   src:"Landesarchiv Baden-Württemberg, Abt. Staatsarchiv Freiburg, F 179/4 (Staatsanwaltschaft Offenburg), Lichtbildmappe, Permalink 5-68430, CC BY 3.0. Verlinktes Foto: Theodor oder Otto Busam, Oberkirch, im Auftrag der Polizei 1921, gemeinfrei (Wikimedia Commons)."}
 ],
 qs:[
  {type:"choice", q:"Wo genau wurde Erzberger angegriffen?", opts:["Im Kurpark direkt vor dem Kurhaus Griesbach","Auf der Kniebisstraße oberhalb von Griesbach, auf dem Rückweg eines Spaziergangs Richtung Alexanderschanze","Am Bahnhof Oppenau beim Aussteigen","Im Gasthaus „Zum Goldenen Engel“ in Ulm"], a:1,
   ok:"Richtig. Die Täter griffen an einer einsamen Stelle im Wald an. Zeugen gab es dort außer Diez nicht."},
  {type:"numbers", q:"Wie viele Täter waren beteiligt, und wie oft wurde Erzberger getroffen?", fields:[{l:"Täter",a:2},{l:"Treffer",a:8}],
   ok:"Richtig: zwei Täter, acht Treffer. Merkt euch die Zahl 8, ihr braucht sie später noch."},
  {type:"choice", q:"Was beweisen der Meldezettel aus Ulm (M 1.6) und die Notiz aus Beuron (M 1.7) zusammen?", opts:["Die Täter waren Studenten, die Erzberger zufällig im Schwarzwald trafen.","Die Täter verfolgten Erzberger über Tage, reisten ihm hinterher und wohnten unter falschen Namen. Es war ein geplanter Anschlag.","Die Post in Beuron hat Erzberger rechtzeitig gewarnt.","Die beiden Männer aus Ulm haben mit der Tat nichts zu tun."], a:1,
   ok:"Richtig. Falsche Namen, Nachfragen bei Post und Kloster und tagelanges Hinterherreisen zeigen: Die Tat war von langer Hand geplant."}
 ],
 hints:[
  "Lest zuerst die Aussage von Carl Diez (M 1.2). Dort steht, wo die beiden spazieren gingen und wann die Schüsse fielen.",
  "Die Zahl der Treffer steht im Befund (M 1.3). Wie viele Männer folgten den beiden Politikern? Vergleicht dazu den Meldezettel (M 1.6) mit der Notiz (M 1.7): Hätten Zufallsbekannte bei der Post nach Erzbergers Adresse gefragt?",
  "Lösungsweg: Frage 1 ist die Kniebisstraße auf dem Rückweg Richtung Alexanderschanze. Frage 2: 2 Täter, 8 Treffer. Frage 3 ist der geplante Anschlag mit falschen Namen und tagelanger Verfolgung."
 ],

  q:{type:"order", q:"Älteste Station oben:", items:["Aufenthalt in Stuttgart, Gasthaus „Zum Badischen Hof“ (unter echtem Namen)","Erzbergers Familie reist früh morgens aus Beuron ab","Nachfrage nach Erzbergers Adresse auf dem Postamt Beuron","Telefonat aus Ulm mit der Erzabtei Beuron: „ins Renchtal“","Schüsse auf der Kniebisstraße"],

{
 id:"a2", no:"II", title:"Opfer und Motiv", sub:"Wer hasste Erzberger, und warum?", role:"Quellenanalyse", min:12, code:"COMPIEGNE",
 az:"Az. St. 1921/26-08 · Beiakte Opfer",
 auftrag:`Ein Raubmord ist es nicht: Erzberger trug noch seinen wertvollen Ring. Findet heraus, <strong>warum</strong> gerade Erzberger sterben sollte, und verfolgt, wie aus <strong>Worten Taten</strong> wurden. Dann vergleicht ihr die Hetze von damals mit einem Fall von heute.`,
 mats:[
  {no:"2.1", kind:"d", title:"Personalakte Matthias Erzberger", img:"erzberger", html:`<dl class="kv"><dt>Geboren</dt><dd>20.9.1875 in Buttenhausen (Württemberg), Sohn eines Schneiders</dd><dt>Partei</dt><dd>Zentrum (katholisch), seit 1903 im Reichstag</dd><dt>1917</dt><dd>treibt im Reichstag die Friedensresolution voran: Er will einen Frieden ohne Eroberungen.</dd><dt>11.11.1918</dt><dd>leitet die deutsche Waffenstillstandskommission und <b>unterschreibt den Waffenstillstand von Compiègne</b>. Damit endet der Erste Weltkrieg.</dd><dt>1919–1920</dt><dd>Reichsfinanzminister. Seine Finanzreform stärkt die Steuern des Reiches und trifft vor allem Wohlhabende.</dd><dt>März 1920</dt><dd>Rücktritt nach dem Prozess gegen Karl Helfferich</dd></dl><p class="small">Die Rechte nennt ihn einen der „Novemberverbrecher“. Nach der Dolchstoßlegende war das Heer „im Felde unbesiegt“ und wurde von Politikern in der Heimat „verraten“.</p>`,
   src:"Nach Christopher Dowe: Matthias Erzberger. Ein Leben für die Demokratie, Stuttgart 2011, und LeMO (DHM). Foto: Bain News Service, Library of Congress (ggbain), keine bekannten Rechte."},
  {no:"2.2", kind:"d", title:"Die Kampagne „Fort mit Erzberger!“", img:"helfferich", html:`<p>Karl Helfferich (DNVP) hasst Erzberger seit 1906. Damals hatte Erzberger Missstände in der Kolonialverwaltung aufgedeckt, für die Helfferich mitverantwortlich war.</p><p>Im Juni 1919 veröffentlicht Helfferich in der „Kreuzzeitung“ eine Artikelserie und danach die Flugschrift <b>„Fort mit Erzberger!“</b>. Er wirft Erzberger vor, einen Meineid geschworen, Politik für den eigenen Geldbeutel gemacht und Steuern hinterzogen zu haben.</p><p>Erzberger verklagt ihn wegen Beleidigung. Im Prozess (19.1.–12.3.1920) erhält Helfferich nur eine Geldstrafe. Erzberger aber ist so beschädigt, dass er zurücktritt.</p>`,
   src:"Nach den Artikeln „Karl Helfferich“ und „Matthias Erzberger“ der deutschsprachigen Wikipedia sowie Norman Domeier: Der Sensationsprozess Erzberger-Helfferich, 2013. Foto: Bain News Service, Library of Congress."},
  {no:"2.3", kind:"d", title:"Der erste Anschlag: Berlin-Moabit, 26. Januar 1920", html:`<p>Als Erzberger das Gerichtsgebäude verlässt, schießt der ehemalige Fähnrich <b>Oltwig von Hirschfeld</b> zweimal auf ihn. Erzberger wird an der Schulter verletzt. Die zweite Kugel prallt an seiner Uhrkette ab.</p><p>Nach seinem Motiv gefragt, nennt Hirschfeld vor allem Helfferichs Flugschrift „Fort mit Erzberger!“. Das Gericht bescheinigt ihm, er sei „sonst von idealer Gesinnung“, und verurteilt ihn zu 18 Monaten Gefängnis.</p><p class="quote">„Die Kugel, die mich treffen soll, ist schon gegossen.“<br><span class="small">Erzberger zu seiner Tochter Maria, April 1921</span></p>`,
   src:"Nach dem Artikel „Matthias Erzberger“ der deutschsprachigen Wikipedia (mit Belegen aus Epstein 1962 und Dowe 2011)."},
  {no:"2.4", kind:"q", title:"Reichstag, 27. September 1921: Gedenken an Erzberger", wide:true, html:`<div class="doc"><p>„[…] Erschütternder aber selbst als diese herben Verluste wirkte auf uns die Nachricht von dem tückischen Meuchelmord, dem unser Kollege Erzberger, Reichsfinanzminister a. D., am 26. August zum Opfer fiel. Dieser Mord hat unser Land in neue schwere Unruhen gestürzt; denn er war nicht die vereinzelte Tat eines blinden Fanatikers oder eines verstiegenen Idealisten, sondern er war der kaltblütige Überfall ausgeschickter Mordgesellen. Schlimmer fast noch: es hat vor der Tat Stimmen gegeben, die sie offen herbeiwünschten, und es hat nach der Tat Stimmen gegeben, die sie billigten, rechtfertigten, entschuldigten. […] Die aber den Kampf gegen ihn vom politischen Felde auf das persönliche übertrugen, die haben teil an der geistigen Verwirrung, der er zum Opfer gefallen ist.“</p></div><p class="small">Die Rede beginnt mit: „Ich eröffne die erste Sitzung des Reichstags nach der Sommerpause.“ Später dankt der Redner einem Verstorbenen für seine Hilfe beim „Vorsitzenden dieses Hauses“.</p>`,
   src:"Verhandlungen des Reichstags, I. Wahlperiode 1920, Bd. 351, 134. Sitzung, 27.9.1921, S. 4568 f. Online in: German History in Documents and Images (GHDI), Dokument 4619."},
  {no:"2.5", kind:"d", title:"Akte von heute: Walter Lübcke (CDU), 2015–2019", wide:true, html:`<dl class="kv"><dt>14.10.2015</dt><dd>Auf einer Bürgerversammlung in Lohfelden bei Kassel verteidigt Regierungspräsident Walter Lübcke eine geplante Flüchtlingsunterkunft gegen Zwischenrufer. Wer die Werte der Verfassung ablehne, sei jederzeit frei, Deutschland zu verlassen.</dd><dt>danach</dt><dd>Seine Antwort wird <b>verkürzt als Video</b> im Internet verbreitet. Es folgen jahrelange Anfeindungen und Morddrohungen.</dd><dt>Chat</dt><dd>Der Rechtsextremist Stephan Ernst nennt Lübcke einen <b>„Volksverräter“</b>. Online postet er unter anderem: „Entweder diese Regierung dankt in kürze ab oder es wird Tote geben“.</dd><dt>1./2.6.2019</dt><dd>Ernst erschießt Lübcke auf der Terrasse seines Wohnhauses in Wolfhagen-Istha.</dd><dt>28.1.2021</dt><dd>Das OLG Frankfurt verurteilt Ernst zu lebenslanger Haft.</dd><dt>Reaktionen</dt><dd>Bundespräsident Steinmeier: „Wo die Sprache verroht, ist die Straftat nicht weit.“ Bundestagspräsident Schäuble: „Wer diesen Nährboden düngt, macht sich mitschuldig.“</dd></dl>`,
   src:"Nach dem Artikel „Mordfall Walter Lübcke“ der deutschsprachigen Wikipedia, mit Belegen aus Urteil und Presse. Die Zitate sind dort nachgewiesen."}
 ],
 qs:[
  {type:"choice", q:"Warum beschimpfte die extreme Rechte Erzberger als „Novemberverbrecher“?", opts:["Weil er im November 1918 den Kaiser abgesetzt hatte","Weil er am 11. November 1918 den Waffenstillstand von Compiègne unterschrieben hatte. Nach der Dolchstoßlegende war das „Verrat“ am unbesiegten Heer.","Weil er im November 1918 die Republik ausgerufen hatte","Weil er Mitglied der KPD war"], a:1,
   ok:"Richtig. Erzberger übernahm eine Verantwortung, vor der sich die Oberste Heeresleitung drückte. Die Dolchstoßlegende machte ihn zum Sündenbock."},
  {type:"order", q:"Die Eskalation: Bringt die Ereignisse in die richtige Reihenfolge (älteste oben).", items:["Helfferichs Artikelserie und Flugschrift „Fort mit Erzberger!“","Hirschfeld schießt in Berlin-Moabit auf Erzberger","Erzberger tritt als Reichsfinanzminister zurück","Mord auf der Kniebisstraße","Teile der Rechtspresse entschuldigen den Mord"],
   ok:"Richtig: 1919 Rufmord, Januar 1920 erster Anschlag, März 1920 Rücktritt, August 1921 Mord, danach Billigung. Aus Worten wurden Schüsse."},
  {type:"match", q:"Hetze 1921 und heute: Ordnet jede Aussage dem passenden Muster zu.", rows:[
    {t:"„Novemberverbrecher“ (rechte Propaganda gegen Erzberger)", a:0},
    {t:"„Volksverräter“ (Chat von Stephan Ernst über Lübcke)", a:0},
    {t:"Helfferich wirft Erzberger Meineid und Steuerhinterziehung vor", a:1},
    {t:"Lübckes Satz wird verkürzt als Video verbreitet", a:1},
    {t:"„Entweder diese Regierung dankt in kürze ab oder es wird Tote geben“", a:2},
    {t:"„…die haben teil an der geistigen Verwirrung“ (1921) und „Wer diesen Nährboden düngt, macht sich mitschuldig“ (2019)", a:3}
   ], cats:["Feindbild: Menschen werden zu „Verrätern“ erklärt","Rufmord: Lügen oder verkürzte Aussagen","Gewaltdrohung","Urteil: Hetzer tragen Mitverantwortung"],
   ok:"Richtig. Die Muster gleichen sich über 100 Jahre: Erst kommt das Feindbild, dann der Rufmord, dann die Drohung, am Ende die Tat."}
 ],
 hints:[
  "Für Frage 1 steht das Datum des 11. November 1918 in der Personalakte (M 2.1). Für die Reihenfolge braucht ihr die Jahreszahlen in M 2.2 und M 2.3.",
  "Achtung bei der Reihenfolge: Der Prozess lief von Januar bis März 1920. Die Schüsse von Hirschfeld fielen mitten im Prozess, der Rücktritt kam erst danach. Bei der Zuordnung gilt: Eine Beschimpfung als „Verräter“ ist ein Feindbild, eine erfundene oder verkürzte Behauptung ist Rufmord.",
  "Lösungsweg: Frage 1 ist der Waffenstillstand von Compiègne. Reihenfolge: Flugschrift, Hirschfeld, Rücktritt, Mord, Rechtspresse. Zuordnung: Novemberverbrecher und Volksverräter sind Feindbild, Helfferich und das Video sind Rufmord, „es wird Tote geben“ ist eine Gewaltdrohung, Löbe und Schäuble sprechen über die Mitverantwortung der Hetzer."
 ],
 bonus:{title:"Kriminalrat-Akte: Quellenkritik", intro:`Die Online-Sammlung, aus der M 2.4 stammt, nennt als Redner „Reichspräsident Friedrich Ebert“. Prüft das am Text selbst: Wer sprach am 27. September 1921 wirklich?`,
  q:{type:"choice", q:"Wer hielt die Rede?", opts:["Reichspräsident Friedrich Ebert (SPD)","Reichstagspräsident Paul Löbe (SPD), der die Sitzung leitete","Reichskanzler Joseph Wirth (Zentrum)"], a:1,
   ok:"Stark ermittelt! Der Redner eröffnet die Sitzung und spricht vom „Vorsitzenden dieses Hauses“. Das kann nur der Reichstagspräsident sein, also Paul Löbe (im Amt 1920–1924). Der Reichspräsident leitete keine Reichstagssitzungen. Auch seriöse Online-Sammlungen können sich irren. Prüft deshalb immer die Quelle selbst."}}
},
{
 id:"a3", no:"III", title:"Fahndung", sub:"Wer sind „Berkner“ und „Briese“?", role:"Fahndung", min:12, code:"EHRHARDT",
 az:"Az. St. 1921/26-08 · Fahndungsakte",
 auftrag:`Die Täter haben kaum versucht, ihre Spuren zu verwischen. Die badische Polizei kennt bald ihre echten Namen: <strong>Heinrich Tillessen</strong> und <strong>Heinrich Schulz</strong>. Findet heraus, was die beiden verbindet, und verfolgt ihren <strong>Fluchtweg</strong> auf der Karte.`,
 mats:[
  {no:"3.1", kind:"d", title:"Fahndungsblatt: Heinrich Tillessen", html:`<dl class="kv"><dt>Geboren</dt><dd>27.11.1894 in Köln, Sohn eines Generalleutnants, streng katholische Familie</dd><dt>Laufbahn</dt><dd>1912 Seekadett der Kaiserlichen Marine. Ab 1917 Wachoffizier unter Kapitän <b>Hermann Ehrhardt</b> auf einem Torpedoboot. Nach der Selbstversenkung der Flotte in Scapa Flow britische Kriegsgefangenschaft bis 1920.</dd><dt>1920</dt><dd>schließt sich beim Kapp-Putsch der <b>Marine-Brigade Ehrhardt</b> an. Dort lernt er Schulz kennen.</dd><dt>1920/21</dt><dd>Leibwächter des BVP-Politikers Georg Heim in <b>Regensburg</b>, zusammen mit Schulz. Radikalisierung im „Deutschvölkischen Schutz- und Trutzbund“</dd><dt>Familie</dt><dd>Sein Bruder Karl Tillessen ist stellvertretender Leiter einer geheimen Organisation in München.</dd></dl><a class="ext" href="${commons("Moordenaar van de Duitse politicus Matthias Erzberger in augustus 1921 de student Heinrich, SFA005001637.jpg")}" target="_blank" rel="noopener">Pressefoto Tillessen, 1921 ↗</a>`,
   src:"Nach dem Artikel „Heinrich Tillessen“ der deutschsprachigen Wikipedia (Belege: Gebhardt 1995). Pressefoto: Spaarnestad Photo, gemeinfrei."},
  {no:"3.2", kind:"d", title:"Fahndungsblatt: Heinrich Schulz", html:`<dl class="kv"><dt>Geboren</dt><dd>20.7.1893 in Saalfeld (Thüringen)</dd><dt>Laufbahn</dt><dd>Kriegsfreiwilliger 1914, dreimal verwundet, Leutnant. Ein Ohr ist durch eine Kriegsverletzung verstümmelt.</dd><dt>1919</dt><dd>ab April <b>Marine-Brigade Ehrhardt</b>, eingesetzt in München, Hof und Berlin</dd><dt>März 1920</dt><dd>beteiligt sich am <b>Kapp-Putsch</b> und besetzt das Berliner Regierungsviertel.</dd><dt>1920/21</dt><dd>Leibwächter von Georg Heim in Regensburg, zusammen mit Tillessen</dd></dl>`,
   src:"Nach dem Artikel „Heinrich Schulz (Attentäter)“ der deutschsprachigen Wikipedia (Belege: Gebhardt 1995, Haehling von Lanzenauer 2008)."},
  {no:"3.3", kind:"q", title:"Foto: Marine-Brigade Ehrhardt in Berlin, März 1920", html:`<p>Beim Kapp-Putsch marschiert die Brigade in Berlin ein. Auf den Stahlhelmen tragen die Soldaten ein Hakenkreuz, schon 1920 ein Zeichen der völkischen Rechten.</p><a class="ext" href="${commons("Bundesarchiv Bild 119-1983-0012, Kapp-Putsch, Marienbrigade Erhardt in Berlin.jpg")}" target="_blank" rel="noopener">Foto im Bundesarchiv-Bestand öffnen ↗</a>`,
   src:"Bundesarchiv, Bild 119-1983-0012, Fotograf unbekannt, März 1920, CC BY-SA 3.0 DE."},
  {no:"3.4", kind:"d", title:"Ermittlungsnotizen nach der Tat (ungeordnet)", html:`<ul class="doc" style="margin:0;padding-left:1.2em;display:grid;gap:6px"><li>Nov./Dez. 1921: Beide leben unter falschem Namen in Budapest und schließen sich einem ungarischen Freikorps an. Dieses hatte ihnen schon bei der Planung Schutz zugesagt.</li><li>Unmittelbar nach der Tat: Die Täter fahren zurück in die Stadt, in der sie seit April 1921 in einer Zentrale arbeiten.</li><li>Tillessen versteckt sich zunächst in den Alpen und wechselt dann über Salzburg ins Burgenland an der österreichisch-ungarischen Grenze.</li><li>31. August 1921: Die Täter verlassen München.</li><li>Später: Ungarn lehnt die Auslieferung ab, weil es kein Abkommen gibt.</li></ul>`,
   src:"Nach den Artikeln „Heinrich Tillessen“ und „Heinrich Schulz (Attentäter)“ der deutschsprachigen Wikipedia."},
  {no:"3.5", kind:"q", title:"Lichtbilder der Gesuchten", wide:true, figs:[{img:"fahndungsfoto", alt:"Zwei Porträtfotos, beschriftet Schulz, H. und Tillessen, Hch.", cap:"Beschriftung: „Schulz, H.“ (links) und „Tillessen, Hch.“ (rechts)"}],
   html:`<p>Mit diesen Fotos fahndet die Polizei nach den beiden Männern. Vergleicht sie mit den Fahndungsblättern M 3.1 und M 3.2.</p>`,
   src:"Landesarchiv Baden-Württemberg, Abt. Staatsarchiv Freiburg, F 179/4 (Staatsanwaltschaft Offenburg), Lichtbildmappe aus dem Ermittlungsverfahren 1921/22, Permalink 5-68430. Lizenz CC BY 3.0."}
 ],
 qs:[
  {type:"choice", q:"Was verbindet Tillessen und Schulz vor allem?", opts:["Sie studierten zusammen in Würzburg.","Beide sind ehemalige Offiziere und dienten in der Marine-Brigade Ehrhardt, einem Freikorps, das 1920 am Kapp-Putsch beteiligt war.","Beide waren Mitglieder der SPD.","Beide arbeiteten als Kaufleute in Jena."], a:1,
   ok:"Richtig. Die Brigade Ehrhardt war ein Freikorps aus ehemaligen Soldaten, das die Republik 1920 stürzen wollte. Sie wurde aufgelöst, aber ihre Männer blieben zusammen."},
  {type:"text", q:"In welcher bayerischen Stadt arbeiteten beide 1920/21 als Leibwächter eines Politikers?", accept:["regensburg"],
   ok:"Richtig, in Regensburg. Die erste Spur führt nach Bayern."},
  {type:"route", q:"Fluchtweg: Klickt die Stationen der Täter nach der Tat in der richtigen Reihenfolge an. Beginnt am Tatort.", a:["griesbach","muenchen","salzburg","budapest"],
   ok:"Richtig: Griesbach, München, Salzburg, Budapest. Alle Wege führen über München."}
 ],
 hints:[
  "Vergleicht die beiden Fahndungsblätter (M 3.1 und M 3.2) Zeile für Zeile. Welche Einheit und welches Ereignis kommen in beiden vor?",
  "Die Stadt der Leibwächter-Stelle steht in beiden Fahndungsblättern unter „1920/21“. Für den Fluchtweg bringt ihr die Notizen in M 3.4 in eine Reihenfolge: Wohin fuhren die Täter direkt nach der Tat, und wann verließen sie diese Stadt?",
  "Lösungsweg: Frage 1 ist die Marine-Brigade Ehrhardt. Frage 2 ist Regensburg. Die Route verläuft Griesbach, München, Salzburg, Budapest."
 ],
 bonus:{title:"Kriminalrat-Akte: Ehrhardts Männer", intro:"Der Kapitän, unter dem Tillessen im Krieg diente, führte auch die Marine-Brigade. Nach ihrer Auflösung 1920 floh er vor der Verhaftung. Er tauchte in einem Land unter, das ihn nicht auslieferte, weil dort Polizei und Regierung sympathisierten.",
  q:{type:"text", q:"In welches Land des Deutschen Reiches floh Hermann Ehrhardt 1920? (Tipp: Es ist nicht Baden.)", accept:["bayern","freistaatbayern"],
   ok:"Richtig, nach Bayern. Ehrhardt entzog sich 1920 der Verhaftung, indem er in die „Ordnungszelle“ Bayern floh (Historisches Lexikon Bayerns). Das ist die Spur zu Akte IV."}}
},
{
 id:"a4a", no:"IV a", title:"Das Netzwerk in München", sub:"Wer gab den Befehl?", role:"alle Rollen", min:11, code:"CONSUL",
 az:"Az. St. 1921/26-08 · Sonderakte München",
 auftrag:`Bei den Ermittlungen findet die Polizei <strong>verschlüsselte Anweisungen</strong>. Entschlüsselt die abgefangene Nachricht, findet die <strong>Zentrale</strong> und rekonstruiert, <strong>wer den Mordbefehl gab</strong>.`,
 mats:[
  {no:"4.1", kind:"r", title:"Abgefangene Nachricht", wide:true, html:`<div class="cipher"><p>Ein Kurier trug eine Nachricht bei sich. Der Schlüssel ist eine Zahl, die ihr am Tatort gefunden habt. Jeder Buchstabe wurde um diese Zahl im Alphabet <b>nach hinten</b> verschoben.</p><div class="cryp" id="cryp"></div><label class="row" for="shift"><b>Chiffrierscheibe:</b> Verschiebung <input id="shift" type="range" min="0" max="25" value="0" style="width:min(260px,60vw)"> <span id="shiftv" class="doc">0</span></label><div class="alpha" id="alpha"></div><div class="small">Obere Zeile: Geheimtext. Untere Zeile: Klartext.</div></div>`,
   src:"Spielmaterial. Die Verschlüsselung ist erfunden. Belegt ist aber, dass die Ermittler „chiffrierte Anweisungen“ und Kuriere der Organisation fanden (Martin Sabrow, Historisches Lexikon Bayerns: Organisation Consul)."},
  {no:"4.2", kind:"d", title:"Ermittlungsergebnis: Die „Organisation Consul“ (O.C.)", html:`<dl class="kv"><dt>Herkunft</dt><dd>1920 nach dem Kapp-Putsch aus der aufgelösten Marine-Brigade Ehrhardt gebildet</dd><dt>Leitung</dt><dd>Kapitän Hermann Ehrhardt, Deckname „Consul Eichmann“</dd><dt>Zentrale</dt><dd>München-Schwabing, etwa 30 hauptamtliche Mitarbeiter, getarnt als Firma</dd><dt>Größe</dt><dd>geschätzt etwa 5.000 Mann, meist ehemalige Offiziere zwischen 20 und 30 Jahren, mit Bezirken im ganzen Reich</dd><dt>Ziel</dt><dd>die Republik zerschlagen, eine Militärdiktatur errichten und den Versailler Vertrag rückgängig machen</dd><dt>Strategie</dt><dd>Morde sollen die Linke zu einem Aufstand provozieren. Den will man mit der Reichswehr niederschlagen und dann selbst die Macht übernehmen.</dd></dl>`,
   src:"Nach Martin Sabrow, Historisches Lexikon Bayerns: „Organisation Consul (O.C.), 1920–1922“, und dem Artikel „Organisation Consul“ der deutschsprachigen Wikipedia. Zur Strategie: Christopher Dowe 2011, S. 149."},
  {no:"4.3", kind:"q", title:"Aus der Satzung der O.C.", html:`<div class="doc"><p>Ziel: „Bekämpfung alles Anti- und Internationalen, des Judentums, der Sozialdemokratie und der linksradikalen Parteien“.</p><p>Jedes Mitglied muss versichern, „deutscher Abstammung“ zu sein.</p></div><div class="doc"><p>Aus dem Geheimstatut: „Verräter verfallen der Feme.“</p></div><p class="small">Feme bedeutet hier, dass ein angeblicher „Verräter“ ohne Gericht hingerichtet wird (Fememord).</p>`,
   src:"Satzungszitate nach dem Artikel „Organisation Consul“ der deutschsprachigen Wikipedia. Geheimstatut zitiert nach Randecker, Schwäbische Zeitung, 24.8.2021."},
  {no:"4.4", kind:"d", title:"Personen in der Zentrale", html:`<dl class="kv"><dt>Hermann Ehrhardt</dt><dd>„Consul“, Leiter der Organisation</dd><dt>Alfred Hoffmann</dt><dd>Stabschef, leitet faktisch die Zentrale</dd><dt>Karl Tillessen</dt><dd>stellvertretender Leiter, Bruder des Täters Heinrich Tillessen</dd><dt>Manfred von Killinger</dt><dd>ehemaliger Torpedoboot-Kommandant, Leiter der militärischen Abteilung, Mitglied im „Germanenorden“. Er gibt Ende Juli oder Anfang August 1921 zwei Männern seiner Abteilung einen Auftrag und hilft ihnen danach bei der Flucht über Österreich nach Ungarn.</dd><dt>Heinrich Tillessen, Heinrich Schulz</dt><dd>seit dem 30. April 1921 in der Zentrale. Tillessen verschickt dort die Zeitschrift „Der Wiking“.</dd></dl><a class="ext" href="${commons("Ehrhardt1920.jpg")}" target="_blank" rel="noopener">Foto: Ehrhardt beim Kapp-Putsch 1920 ↗</a>`,
   src:"Nach Sabrow (HLB), den Artikeln „Manfred von Killinger“ und „Heinrich Tillessen“ der deutschsprachigen Wikipedia sowie Martin Sabrow: Der Rathenaumord, München 1994, S. 23–27. Foto: Nationaal Archief NL, gemeinfrei."},
  {no:"4.4 b", kind:"q", title:"Erkennungsdienst: Personenlichtbilder", wide:true, figs:[{img:"killinger", alt:"Polizeifotos Manfred von Killinger im Profil, frontal und mit Hut", cap:"„v. Killinger, Manfred“"},{img:"hoffmann", alt:"Polizeifotos Alfred Hoffmann im Profil, frontal und mit Hut", cap:"„Hoffmann, Alfred“"}],
   html:`<p>Aus dem Album „Personen-Lichtbilder“ der Ermittler: erkennungsdienstliche Aufnahmen zweier Männer aus der Münchner Zentrale, jeweils im Profil, von vorn und mit Hut.</p>`,
   src:"Landesarchiv Baden-Württemberg, Abt. Staatsarchiv Freiburg, F 179/4 (Staatsanwaltschaft Offenburg), Lichtbildmappe „Personen-Lichtbilder“ aus dem Ermittlungsverfahren 1921/22, Permalink 5-68430. Lizenz CC BY 3.0. Ausschnitte."}
 ],
 qs:[
  {type:"cipher", q:"Entschlüsselt die Nachricht (M 4.1). Wie lautet die Adresse der Zentrale?", accept:["trautenwolf"], hintAccept:"Schreibt die Straße und die Hausnummer.",
   ok:"Richtig: Trautenwolfstraße 8 in München-Schwabing. Hier saß die Zentrale, getarnt als „Bayerische Holzverwertungsgesellschaft“."},
  {type:"match", q:"Organigramm: Wer hatte welche Funktion?", rows:[
    {t:"„Consul“, oberster Leiter", a:0},{t:"Stabschef, leitet faktisch die Zentrale", a:1},{t:"Leiter der militärischen Abteilung, gibt den Mordauftrag", a:2},{t:"Stellvertretender Leiter, Bruder eines Täters", a:3}
   ], cats:["Hermann Ehrhardt","Alfred Hoffmann","Manfred von Killinger","Karl Tillessen"],
   ok:"Richtig. Der Befehl kam aus der Münchner Zentrale: von Killinger an Tillessen und Schulz, nach Sabrow mit Billigung Ehrhardts."},
  {type:"choice", q:"Welches Ziel verfolgte die O.C. mit dem Mord laut Forschung?", opts:["Sie wollte Rache für einen persönlichen Streit.","Sie wollte Unruhen und einen Aufstand der Linken provozieren, um einen Vorwand für einen Staatsstreich und eine Diktatur zu bekommen.","Sie wollte Erzbergers Geld erbeuten.","Sie wollte Bayern vom Reich abspalten."], a:1,
   ok:"Richtig. Der Mord war Teil eines politischen Plans gegen die Demokratie (Dowe 2011). Er war kein Einzelfall, sondern Terror."}
 ],
 hints:[
  "Die Zahl der Treffer aus Akte I ist der Schlüssel. Bewegt die Chiffrierscheibe, bis in der unteren Zeile lesbare Wörter stehen.",
  "Die Verschiebung ist 8. Lest dann jeden Buchstaben des Geheimtexts in der oberen Zeile und den darunterstehenden Klartext. Für das Organigramm steht alles in M 4.4.",
  "Lösungsweg: Die Adresse ist Trautenwolfstraße 8 (ACHT). Organigramm: Ehrhardt ist Consul, Hoffmann Stabschef, Killinger Leiter der militärischen Abteilung, Karl Tillessen Stellvertreter. Das Ziel war, Unruhen zu provozieren und einen Vorwand für eine Diktatur zu bekommen."
 ],
 bonus:{title:"Kriminalrat-Akte: Ist der Fall wirklich geklärt?", intro:"Nach 1945 sagten die Täter aus, der „Germanenorden“ habe sie ausgewählt. Der Historiker Martin Sabrow hält das für glaubhaft. Der Rechtshistoriker Cord Gebhardt meint dagegen, die Rolle des Germanenordens sei ungeklärt.",
  q:{type:"choice", q:"Was folgt daraus für euren Bericht?", opts:["Der Auftraggeber ist eindeutig bewiesen.","Sicher ist: Der Auftrag kam aus der Münchner O.C.-Zentrale über Killinger. Wer genau ihn ausgelöst hat, ist in der Forschung umstritten. Das muss der Bericht so sagen.","Die Täter haben allein gehandelt."], a:1,
   ok:"Genau. Gute Historiker und gute Ermittler trennen das, was belegt ist, von dem, was umstritten ist."}}
},
{
 id:"a4b", no:"IV b", title:"Die schützende Hand", sub:"Warum entkamen die Täter?", role:"alle Rollen", min:10, code:"ORDNUNGSZELLE",
 az:"Az. St. 1921/26-08 · Sonderakte Bayern",
 auftrag:`Die Täter sind bekannt und die Zentrale ist gefunden. Trotzdem entkommen Tillessen und Schulz. Findet heraus, <strong>wer sie in Bayern schützte</strong>, und beurteilt, <strong>warum die Ermittlungen scheiterten</strong>.`,
 mats:[
  {no:"4.5", kind:"d", title:"Personalakte Ernst Pöhner, Polizeipräsident von München", html:`<dl class="kv"><dt>Amt</dt><dd>Polizeipräsident von München vom 3.5.1919 bis 28.9.1921</dd><dt>Netzwerk</dt><dd>Mitglied im Alldeutschen Verband und in der völkischen Thule-Gesellschaft. Er duldet und deckt die O.C. Für die politische Abteilung seiner Polizei setzt er <b>Wilhelm Frick</b> ein.</dd><dt>1920</dt><dd>zwingt mit anderen die SPD-Regierung Hoffmann zum Rücktritt. Gustav von Kahr wird Ministerpräsident.</dd><dt>1923</dt><dd>beteiligt am Hitler-Putsch. Vor Gericht sagt er 1924, er betreibe das, was man ihm als Hochverrat vorwerfe, „bereits seit fünf Jahren“.</dd></dl><a class="ext" href="${commons("Ernst Pohner.jpg")}" target="_blank" rel="noopener">Foto Pöhner ↗</a>`,
   src:"Nach dem Artikel „Ernst Pöhner“ der deutschsprachigen Wikipedia und Hans Günter Hockerts, NDB 20 (2001). Foto: gemeinfrei, Bayerische Staatsbibliothek, Bildarchiv."},
  {no:"4.6", kind:"d", title:"Vermerk: Hilfe für die Flüchtigen", html:`<ul style="margin:0;padding-left:1.2em;display:grid;gap:6px"><li>Die Münchner Polizei warnte die Gesuchten vor der Verhaftung und stellte ihnen die <b>Pässe</b> für die Flucht aus.</li><li>Nach einer Darstellung versorgte Polizeipräsident Pöhner die Täter selbst mit Pässen. Ein Salzburger Polizeipräsident soll sie persönlich nach Ungarn begleitet haben.</li><li>Ehrhardt entkommt nach einer Warnung. Spuren führen über den Wehrverbandsführer Otto Pittinger bis in das Umfeld der bayerischen Regierung unter Kahr.</li><li>Ungarn liefert die Täter nicht aus.</li></ul>`,
   src:"Nach Sabrow: Der Rathenaumord, 1994, S. 23–25 und 50 (zitiert im Artikel „Matthias Erzberger“ der deutschsprachigen Wikipedia), sowie dem Lexikon der Politischen Strafprozesse: „Erzberger-Attentat“."},
  {no:"4.7", kind:"d", title:"Die „Ordnungszelle Bayern“", img:"kahr", html:`<p>Nach der Räterepublik von 1919 sehen konservative und völkische Kreise Bayern als <b>„Ordnungszelle“</b>. Gemeint ist ein Bollwerk gegen das „rote“ Berlin. Ministerpräsident <b>Gustav von Kahr</b> (seit März 1920) stützt sich dabei auch auf Rechtsextreme.</p><p>Nach dem Erzberger-Mord erlässt Reichspräsident Ebert am 29.8.1921 eine <b>Verordnung zum Schutz der Republik</b>. Kahr weigert sich, sie in Bayern umzusetzen. Darauf entzieht ihm seine Partei, die BVP, die Unterstützung, und Kahr muss im September 1921 zurücktreten.</p><p>Zitat aus Hitlers „Mein Kampf“ über Pöhner und Frick: Sie seien „die einzigen höheren Staatsbeamten, die schon damals den Mut besaßen, erst Deutsche und dann Beamte zu sein.“</p>`,
   src:"Nach dem Artikel „Ordnungszelle“ der deutschsprachigen Wikipedia, LeMO (DHM): „Ordnungszelle Bayern“, und dem Artikel „Ernst Pöhner“ (Zitat). Foto Kahr: Artur Braun, 1920, gemeinfrei."},
  {no:"4.8", kind:"d", title:"Gerichtsakte: Prozess gegen Killinger", html:`<dl class="kv"><dt>Sept. 1921</dt><dd>Killinger wird verhaftet. Auch 34 O.C.-Mitglieder werden reichsweit festgenommen, die meisten aber bald wieder freigelassen.</dd><dt>7.–13.6.1922</dt><dd>Schwurgericht Offenburg. Anklage gegen Killinger wegen Beihilfe zum Mord.</dd><dt>Urteil</dt><dd><b>Freispruch</b> durch die Geschworenen, „trotz belastender Beweismittel“. Die Täter sind ja flüchtig.</dd><dt>28.2.1923</dt><dd>Das Reichsgericht bestätigt den Freispruch.</dd></dl>`,
   src:"Nach den Artikeln „Manfred von Killinger“ und „Organisation Consul“ der deutschsprachigen Wikipedia sowie dem Lexikon der Politischen Strafprozesse."}
 ],
 qs:[
  {type:"choice", q:"Wer verschaffte den Tätern die Pässe für die Flucht?", opts:["Die badische Polizei in Offenburg","Die Münchner Polizei unter Polizeipräsident Ernst Pöhner","Die Reichsregierung in Berlin","Das Postamt Beuron"], a:1,
   ok:"Richtig. Die Polizei, die die Täter hätte festnehmen müssen, half ihnen bei der Flucht."},
  {type:"choice", q:"Warum musste Ministerpräsident Kahr im September 1921 zurücktreten?", opts:["Er wurde selbst wegen des Mordes angeklagt.","Er weigerte sich, die Verordnung zum Schutz der Republik umzusetzen, und verlor die Unterstützung der BVP.","Er hatte die Wahl gegen die SPD verloren.","Er wurde von der O.C. bedroht."], a:1,
   ok:"Richtig. Bayern stellte sich gegen den Schutz der Republik. 1922 wiederholte sich das beim Republikschutzgesetz."},
  {type:"multi", q:"Urteil: Warum scheiterten die Ermittlungen 1921/22? Wählt alle zutreffenden Gründe.", opts:[
    {t:"Teile der bayerischen Polizei warnten und deckten die Täter und gaben ihnen Pässe.", c:true},
    {t:"Die Täter blieben unbekannt, weil sie keine Spuren hinterließen.", c:false},
    {t:"Ungarn lieferte die Täter nicht aus.", c:true},
    {t:"Geschworene sprachen den Auftraggeber Killinger trotz belastender Beweise frei.", c:true},
    {t:"Die bayerische Regierung verweigerte sich dem Schutz der Republik („Ordnungszelle“).", c:true},
    {t:"Die badische Polizei ermittelte nicht.", c:false}],
   ok:"Richtig. Die Täter waren schnell bekannt. Sie entkamen, weil Teile von Staat und Justiz in Bayern auf ihrer Seite standen. Das ist der Kern des Falls."}
 ],
 hints:[
  "Lest den Vermerk M 4.6. Dort steht, wer die Pässe ausstellte. Zu Kahr findet ihr die Antwort in M 4.7.",
  "Bei der letzten Frage: Prüft jede Aussage an den Akten. Waren die Täter wirklich unbekannt (Akte III)? Hat die badische Polizei nicht ermittelt (M 4.6)? Was geschah im Killinger-Prozess (M 4.8)?",
  "Lösungsweg: Frage 1 ist die Münchner Polizei unter Pöhner. Frage 2 ist die Weigerung, die Verordnung zum Schutz der Republik umzusetzen. Frage 3: Richtig sind Polizei und Pässe, Ungarn, Killinger-Freispruch und Ordnungszelle. Falsch sind „Täter unbekannt“ und „Baden ermittelte nicht“."
 ],
 bonus:{title:"Kriminalrat-Akte: „Erst Deutsche und dann Beamte“", intro:"Hitler lobte Pöhner und Frick mit diesem Satz (M 4.7).",
  q:{type:"choice", q:"Was verrät der Satz über das Problem der Weimarer Republik?", opts:["Beamte sollten zuerst dem Gesetz und der Verfassung dienen. Pöhner und Frick stellten ihre eigene Vorstellung von „Nation“ über Recht und Verfassung.","Beamte sollten keine Deutschen sein.","Der Satz lobt die Treue der Beamten zur Republik."], a:0,
   ok:"Genau. Beamte, die die Republik verachteten, schützten ihre Feinde. Man spricht von einer „Republik ohne Republikaner“ in Teilen von Justiz und Verwaltung."}}
},
{
 id:"a5", no:"V", title:"Abschluss und neue Spur", sub:"Bericht an den Staatsanwalt", role:"Aktenführung", min:5, code:"RATHENAU",
 az:"Az. St. 1922 · Eingang Juni 1922",
 auftrag:`Schreibt euren <strong>Ermittlungsbericht</strong> (Reiter „Ermittlungsbericht“) und legt ihn dem Staatsanwalt vor. Danach geht ein neuer Hinweis ein: Die O.C. ist <strong>nicht</strong> zerschlagen. Wer ist das nächste Ziel?`,
 mats:[
  {no:"5.1", kind:"d", title:"Lagebericht Juni 1922", html:`<ul style="margin:0;padding-left:1.2em;display:grid;gap:6px"><li>4. Juni 1922: Anschlag mit Blausäure auf Philipp Scheidemann (SPD), der 1918 die Republik ausgerufen hatte. Er überlebt, weil der Wind das Gift verweht.</li><li>Juni 1922: O.C.-Sprengstoffanschläge in Hamburg</li><li>Seit Februar 1922 ist ein Mann Reichsaußenminister, der mit den Siegermächten verhandelt und die Reparationen erfüllen will („Erfüllungspolitik“). Er ist Jude und wird deshalb zusätzlich antisemitisch angefeindet.</li></ul>`,
   src:"Nach Sabrow (HLB), „Organisation Consul“, und dem Artikel „Walther Rathenau“ der deutschsprachigen Wikipedia."},
  {no:"5.2", kind:"q", title:"Hetzvers, verbreitet 1922", html:`<div class="warnbox"><b>Antisemitische Quelle</b><p>Der Vers wird hier gezeigt, weil er belegt, wie offen zum Mord aufgerufen wurde. Er ist menschenverachtend.</p></div><div class="doc"><p>„Knallt ab den Walther Rathenau, die gottverfluchte Judensau.“</p></div>`,
   src:"In völkischen Kreisen 1922 verbreitet. Zitiert u. a. bei Sabrow: Die verdrängte Verschwörung, Frankfurt a. M. 1999."},
  {no:"5.3", kind:"d", title:"Personalakte: der Reichsaußenminister", img:"rathenau", html:`<dl class="kv"><dt>Name</dt><dd>Walther Rathenau (DDP), geb. 1867 in Berlin</dd><dt>Beruf</dt><dd>Industrieller (AEG), Schriftsteller. Organisierte im Ersten Weltkrieg die Rohstoffversorgung.</dd><dt>Amt</dt><dd>Reichsaußenminister seit Februar 1922</dd><dt>Wohnung</dt><dd>Villa Koenigsallee 65, Berlin-Grunewald. Er fährt im offenen Wagen ohne Polizeischutz ins Auswärtige Amt.</dd></dl>`,
   src:"Nach dem Artikel „Walther Rathenau“ der deutschsprachigen Wikipedia (Belege: Sabrow 1994). Foto: Bain News Service, Library of Congress."}
 ],
 qs:[
  {type:"check", q:"Euer Ermittlungsbericht ist ausgefüllt (Reiter „Ermittlungsbericht“) und dem Staatsanwalt (der Lehrkraft) vorgelegt.", label:"Ja, der Bericht ist fertig und vorgelegt.",
   ok:"Bericht eingegangen."},
  {type:"choice", q:"Wer ist nach den Akten das nächste Ziel der O.C.?", opts:["Philipp Scheidemann, er wurde aber schon angegriffen","Reichsaußenminister Walther Rathenau","Ministerpräsident Gustav von Kahr","Kapitän Hermann Ehrhardt"], a:1,
   ok:"Eure Prognose stimmt, aber die Warnung kommt zu spät."}
 ],
 reveal:{after:1, html:`<div class="figs"><figure class="fig" style="max-width:420px"><div class="figimg"><img src="${IMG.telegramm}" alt="Telegramm der Telegraphie des Deutschen Reichs vom 24. Juni 1922"></div><figcaption>Eingang beim badischen Staatspräsidenten, 24. Juni 1922</figcaption></figure></div><div class="telegram">s berlin reichstag 24.6. 11.55 = staatspraesident hummel karlsruhe = reichsminister rathenau heute vormittag auf fahrt in das amt aus vorueberfahrendem auto erschoszen worden taeter unbekannt = nieser</div><p class="small">Originaltelegramm. Landesarchiv Baden-Württemberg, Abt. Generallandesarchiv Karlsruhe, Badisches Staatsministerium, Akte „Trauerfeiern für den ermordeten Reichsaußenminister Walther Rathenau“, Permalink 4-2015677, CC BY 3.0. Die Ermittlung geht weiter in Akte VI.</p>`},
 hints:[
  "Lest den Lagebericht M 5.1 genau. Scheidemann wurde schon angegriffen. Wer wird zusätzlich antisemitisch angefeindet?",
  "Der Hetzvers M 5.2 nennt den Namen ausdrücklich.",
  "Lösungsweg: Setzt den Haken, wenn der Bericht vorliegt. Das nächste Ziel ist Walther Rathenau."
 ],
 bonus:{title:"Kriminalrat-Akte: Was geschah mit Erzbergers Mördern?", intro:"Bringt das Schicksal der Täter in die richtige Reihenfolge.",
  q:{type:"order", q:"Älteste Station oben:", items:["Flucht nach Ungarn, später Spanien bzw. Spanisch-Guinea","Rückkehr nach Deutschland und Straffreiheit durch die NS-Amnestie vom 21.3.1933","Eintritt in NSDAP und SA bzw. SS","Tillessen wird in Konstanz zu 15 Jahren Zuchthaus verurteilt (28.2.1947)","Schulz wird in Offenburg zu 12 Jahren verurteilt (Juli 1950)","Beide kommen 1952 frei"],
   ok:"Richtig. Erst die Bundesrepublik bzw. die Justiz der Besatzungszeit verurteilte die Täter, mehr als 25 Jahre nach der Tat."}}
},
{
 id:"a6", no:"VI", title:"Mord in der Koenigsallee", sub:"Berlin-Grunewald, 24. Juni 1922", role:"alle Rollen", min:10, code:"SAALECK",
 az:"Az. 12 J. 2/1922 · Staatsgerichtshof zum Schutze der Republik",
 auftrag:`Zehn Monate nach Erzberger schlägt dasselbe Netzwerk wieder zu. Wertet das <strong>Telegramm</strong>, das <strong>Urteil</strong> und die <strong>Plakate</strong> aus: Wer war beteiligt, wie reagierte die Republik, und was blieb wie im Fall Erzberger <strong>im Dunkeln</strong>?`,
 mats:[
  {no:"6.1", kind:"q", title:"Aus dem Urteil des Staatsgerichtshofs, Oktober 1922", wide:true, figs:[{img:"urteil", alt:"Erste Seite der Urteilsabschrift „Im Namen des Reichs“ mit Liste der Angeklagten", cap:"Erste Seite der Abschrift: „Im Namen des Reichs. In der Strafsache gegen den Studenten Ernst Werner Techow …“"}],
   html:`<div class="doc"><p>„Am 24. Juni 1922 Vormittag gegen 10 3/4 Uhr ist auf der Königsallee in Berlin-Grunewald der Reichsminister Dr. Walter Rathenau erschossen worden. […]</p><p>Der Minister Dr. Rathenau befand sich in seinem Kraftwagen auf dem Weg von seiner Wohnung ins Auswärtige Amt. In einem Kraftwagen, der von Ernst Werner Techow gelenkt wurde und dem Wagen des Ministers folgte, saßen der Studierende der Rechtswissenschaft Erwin Kern und der Maschineningenieur Hermann Fischer. Dieser Wagen holte links den Wagen des Ministers ein und als er neben ihm gelangt war, gab von den beiden, Kern und Fischer, der eine aus einer Maschinenpistole eine Anzahl von Schüssen auf Dr. Rathenau ab, während der andere eine Handgranate in dessen Wagen warf, die alsbald zerknallte. […]</p><p>Mitte Juni kamen Kern und Fischer in Berlin zusammen und bezogen eine gemeinsame Wohnung. Zu ihnen gesellte sich zunächst der Angeklagte von Salomon. […] Inzwischen hatten Kern und Fischer von dem Plane eines Unterprimaners Heinz Stubenrauch gehört, den Minister Dr. Rathenau zu erschießen […]. Sie wandten sich an den Angeklagten Ernst Werner Techow, der der Organisation Consul angehörte und zu ihrem Adressen- und Befehlsempfänger bestellt war.“</p></div><p class="small">Ein Unterprimaner besuchte die vorletzte Klasse des Gymnasiums. Er war also ein Schüler.</p>`,
   src:"Urteil des Staatsgerichtshofs zum Schutze der Republik, St.P.R. 6/22 (Abschrift, Auszüge). Landesarchiv Baden-Württemberg, Abt. Generallandesarchiv Karlsruhe, Nachlass Constantin Fehrenbach, Permalink 4-3954464, CC BY 3.0."},
  {no:"6.2", kind:"d", title:"Ermittlungsstand: Die Beteiligten", html:`<dl class="kv"><dt>Erwin Kern</dt><dd>23, Jurastudent, ehemaliger Marineoffizier. Schoss mit einer Maschinenpistole MP 18.</dd><dt>Hermann Fischer</dt><dd>26, Maschineningenieur. Warf die Handgranate.</dd><dt>Ernst Werner Techow</dt><dd>20, Student, O.C.-Mitglied. Lenkte den Tatwagen.</dd><dt>Ernst von Salomon</dt><dd>19, O.C.-Mitglied. Spähte Fahrtstrecke und Wohnhaus aus und suchte einen Fahrer. Schrieb 1951 darüber den Bestseller „Der Fragebogen“.</dd><dt>Willi Günther</dt><dd>prahlte öffentlich mit der Tat. Wurde am 26.6. verhaftet und gestand.</dd><dt>Flucht</dt><dd>Kern und Fischer werden am 17.7.1922 auf Burg Saaleck an der Saale gestellt. Der Burgbesitzer ist O.C.-Mitglied. Ein Polizist trifft Kern tödlich, Fischer erschießt sich selbst.</dd></dl>`,
   src:"Nach dem Artikel „Walther Rathenau“ der deutschsprachigen Wikipedia, Abschnitt Ermordung (Belege: Sabrow 1994), und dem Artikel „Organisation Consul“."},
  {no:"6.3", kind:"q", title:"Plakate der Reichsregierung, Juni 1922", wide:true, figs:[{img:"aufruf", alt:"Orangefarbenes Plakat Aufruf! Der Mord an dem Reichsminister Dr. Rathenau, Es lebe die Republik", cap:"„Aufruf!“ (Druck: C. F. Müller, Karlsruhe)"},{img:"volk", alt:"Plakat An das deutsche Volk! mit Zeigefinger-Symbolen", cap:"„An das deutsche Volk!“ (Druck: Uehlin, Schopfheim)"}],
   html:`<div class="doc"><p>„Der Mord an dem Reichsminister Dr. Rathenau hat die schweren Gefahren enthüllt, denen Deutschland durch innerpolitische Gährungen ausgesetzt ist. […] Eine ruchlose und nichtswürdige Verhetzung, welche sich gegen die Staatsform richtet und ihre Diener für vogelfrei erklärt, treibt immer wieder unklare, politisch verblendete, oder verwilderte Köpfe zu Mordversuch und Mord. Ein Netz von Verschwörung droht den inneren Frieden, die Grundlage einer deutschen Erneuerung, zu zerstören. Der Mord an Dr. Rathenau ist nur ein Glied in einer Kette wohlvorbereiteter Anschläge auf die Republik. Zuerst sollen die Führer der Republik, dann soll die Republik selbst fallen. […] Der Ruf: ‚Die Republik ist in Gefahr!‘ muß alle freiheitlichen, für den Aufbau eines demokratischen Staatswesens arbeitenden Schichten der Bevölkerung zusammenschließen und einigen. […] Es lebe die Republik! Die Reichsregierung. gez. Dr. Wirth.“</p></div>`,
   src:"Landesarchiv Baden-Württemberg, Abt. Staatsarchiv Freiburg, Plakatsammlung, Permalinks 5-133711 (datiert 24.6.1922) und 5-133710, CC BY 3.0. Wortlaut beider Fassungen gleich; Rechtschreibung des Originals."},
  {no:"6.4", kind:"q", title:"Reichskanzler Joseph Wirth (Zentrum) im Reichstag, 25. Juni 1922", html:`<div class="doc"><p>„Da steht der Feind, der sein Gift in die Wunden eines Volkes träufelt. – Da steht der Feind – und darüber ist kein Zweifel: dieser Feind steht rechts!“</p></div><p class="small">Wirth zeigte bei diesen Worten auf die Bänke der DNVP, Helfferichs Partei. Helfferich hatte Rathenau am Vortag des Mordes im Reichstag scharf angegriffen.</p>`,
   src:"Verhandlungen des Reichstags, I. Wahlperiode, Sitzung vom 25.6.1922 (Stenographischer Bericht). Vielfach abgedruckt, u. a. in LeMO (DHM)."},
  {no:"6.5", kind:"q", title:"Trauerplakat aus Karlsruhe", figs:[{img:"trauerplakat", alt:"Plakat: Trauer-Kundgebung für Walter Rathenau im großen Saale der Festhalle, heute Montag abends 8 Uhr", cap:"„Alle Männer und Frauen, alle Freunde der Republik sind eingeladen …“"}],
   html:`<p>Eingeladen haben drei Parteien: Zentrum, SPD und die Deutsche Demokratische Partei. Sie bildeten in der Nationalversammlung die „Weimarer Koalition“. Reichsweit demonstrierten nach dem Mord Millionen Menschen für die Republik.</p>`,
   src:"Landesarchiv Baden-Württemberg, Abt. Generallandesarchiv Karlsruhe, Badisches Staatsministerium, Permalink 4-2015677 (Findbuch: „Plakat für die Trauerfeier in Karlsruhe, 25. Juni 1922“), CC BY 3.0."},
  {no:"6.6", kind:"d", title:"Was danach geschah", html:`<dl class="kv"><dt>21.7.1922</dt><dd>Das <b>Republikschutzgesetz</b> tritt in Kraft (Reichstag: 303 zu 102 Stimmen). Es schafft einen Staatsgerichtshof, die O.C. wird verboten.</dd><dt>Bayern</dt><dd>BVP und DNVP stimmen dagegen. Bayern erlässt eine eigene Verordnung, die Prozesse an bayerische Volksgerichte zieht. Erst am 11.8.1922 einigen sich Reich und Bayern auf einen Kompromiss.</dd><dt>3.–14.10.1922</dt><dd>Prozess vor dem Staatsgerichtshof in Leipzig: Techow erhält 15 Jahre Zuchthaus (Beihilfe), von Salomon 5 Jahre, Karl Tillessen 3 und Plaas 2 Jahre. Das Gericht lässt offen, ob ein organisiertes Komplott hinter der Tat stand, und erklärt sie mit antisemitischer Hetze junger Fanatiker.</dd><dt>17.7.1933</dt><dd>Die Nationalsozialisten feiern Kern und Fischer bei einer Gedenkfeier auf Burg Saaleck, in Anwesenheit Ehrhardts und Himmlers.</dd></dl>`,
   src:"Nach den Artikeln „Walther Rathenau“ und „Republikschutzgesetz“ der deutschsprachigen Wikipedia (Belege: Sabrow 1994)."}
 ],
